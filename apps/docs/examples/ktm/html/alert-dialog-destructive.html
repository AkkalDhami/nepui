<link rel="stylesheet" href="./styles/button.css" />
<link rel="stylesheet" href="./styles/alert-dialog.css" />

<button
  class="np-button np-button-outline"
  type="button"
  commandfor="alert-dialog-destructive-dialog"
  command="show-modal"
>
  Delete Chat
</button>
<dialog
  id="alert-dialog-destructive-dialog"
  class="np-alert-dialog np-alert-dialog-sm"
  role="alertdialog"
  aria-labelledby="alert-dialog-destructive-dialog-title"
  aria-describedby="alert-dialog-destructive-dialog-description"
>
  <div class="np-alert-dialog-header">
    <div class="np-alert-dialog-media" style="color: var(--np-destructive)">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 6h18" />
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
        <line x1="10" x2="10" y1="11" y2="17" />
        <line x1="14" x2="14" y1="11" y2="17" />
      </svg>
    </div>
    <h2
      id="alert-dialog-destructive-dialog-title"
      class="np-alert-dialog-title"
    >
      Delete chat?
    </h2>
    <p
      id="alert-dialog-destructive-dialog-description"
      class="np-alert-dialog-description"
    >
      This will permanently delete this chat conversation. Check Settings to
      delete any memories saved during this chat.
    </p>
  </div>
  <div class="np-alert-dialog-footer">
    <button
      class="np-button np-button-outline"
      type="button"
      commandfor="alert-dialog-destructive-dialog"
      command="close"
      autofocus
    >
      Cancel
    </button>
    <button class="np-button np-button-destructive" type="button">
      Delete
    </button>
  </div>
</dialog>
