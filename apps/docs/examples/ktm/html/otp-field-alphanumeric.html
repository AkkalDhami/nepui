<link rel="stylesheet" href="./styles/field.css" />

<div style="display: grid; place-items: center">
  <div class="np-field">
    <label
      class="np-field-label"
      id="otp-alphanumeric-label"
      for="otp-alphanumeric"
      >Recovery code</label
    >
    <div
      class="np-otp-field"
      role="group"
      aria-labelledby="otp-alphanumeric-label"
      data-validation="alphanumeric"
    >
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="text"
        maxlength="1"
        autocomplete="one-time-code"
        id="otp-alphanumeric"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="text"
        maxlength="1"
        aria-label="Character 2 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="text"
        maxlength="1"
        aria-label="Character 3 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="text"
        maxlength="1"
        aria-label="Character 4 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="text"
        maxlength="1"
        aria-label="Character 5 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="text"
        maxlength="1"
        aria-label="Character 6 of 6"
      />
    </div>
    <p class="np-field-description">
      Accept letters and numbers for backup codes such as <code>A7C9XZ</code>.
    </p>
  </div>
</div>
