<div
  style="
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
    gap: 1.25rem 2rem;
  "
>
  <div
    style="
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 1.5rem;
      font-weight: 600;
    "
  >
    <span style="font-size: 0.75rem; font-weight: 400; opacity: 0.6"
      >slide</span
    >
    <p style="margin: 0">
      Feels
      <span
        class="np-word-rotate"
        role="img"
        aria-label="fast, calm, sharp, alive"
      >
        <span class="np-word-rotate-item" aria-hidden="true">fast</span>
        <span class="np-word-rotate-item" aria-hidden="true">calm</span>
        <span class="np-word-rotate-item" aria-hidden="true">sharp</span>
        <span class="np-word-rotate-item" aria-hidden="true">alive</span>
      </span>
    </p>
  </div>
