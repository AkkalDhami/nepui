<div
  class="np-color-picker"
  aria-label="OKLCH color"
  data-space="oklch"
  data-default-value="oklch(0.65 0.2 250)"
>
  <div class="np-color-picker-area"></div>
  <div class="np-color-picker-slider" data-channel="hue"></div>
  <div class="np-color-picker-slider" data-channel="alpha"></div>
  <div class="np-color-picker-row">
    <div class="np-color-picker-swatch"></div>
    <input class="np-color-picker-input" />
  </div>
</div>
