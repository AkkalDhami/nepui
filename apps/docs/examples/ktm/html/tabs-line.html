<div class="np-tabs" style="width: 100%; max-width: 24rem">
  <div class="np-tabs-list np-tabs-line" role="tablist" aria-label="Project">
    <button
      type="button"
      class="np-tabs-trigger"
      role="tab"
      id="tabs-line-overview"
      aria-selected="true"
      aria-controls="tabs-line-overview-panel"
    >
      Overview
    </button>
    <button
      type="button"
      class="np-tabs-trigger"
      role="tab"
      id="tabs-line-analytics"
      aria-selected="false"
      aria-controls="tabs-line-analytics-panel"
      tabindex="-1"
    >
      Analytics
    </button>
    <button
      type="button"
      class="np-tabs-trigger"
      role="tab"
      id="tabs-line-reports"
      aria-selected="false"
      aria-controls="tabs-line-reports-panel"
      tabindex="-1"
    >
      Reports
    </button>
  </div>
  <div
    class="np-tabs-content"
    role="tabpanel"
    id="tabs-line-overview-panel"
    aria-labelledby="tabs-line-overview"
    tabindex="0"
  >
    View your key metrics and recent project activity.
  </div>
  <div
    class="np-tabs-content"
    role="tabpanel"
    id="tabs-line-analytics-panel"
    aria-labelledby="tabs-line-analytics"
    tabindex="0"
    hidden
  >
    Track performance and user engagement metrics.
  </div>
  <div
    class="np-tabs-content"
    role="tabpanel"
    id="tabs-line-reports-panel"
    aria-labelledby="tabs-line-reports"
    tabindex="0"
    hidden
  >
    Generate and download your detailed reports.
  </div>
</div>
