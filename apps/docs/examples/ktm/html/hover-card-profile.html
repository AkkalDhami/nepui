<link rel="stylesheet" href="./styles/button.css" />
<link rel="stylesheet" href="./styles/avatar.css" />
<link rel="stylesheet" href="./styles/badge.css" />

<div class="np-hover-card">
  <a class="np-hover-card-trigger np-button np-button-outline" href="#"
    >Hover for profile</a
  >
  <div class="np-hover-card-content" style="width: 20rem">
    <div style="display: grid; gap: 0.625rem">
      <div style="display: flex; align-items: center; gap: 0.5rem">
        <span class="np-avatar"
          ><img
            class="np-avatar-image"
            src="https://github.com/shadcn.png"
            alt="@shadcn"
          /><span class="np-avatar-fallback">CN</span></span
        >
        <div style="display: grid; flex: 1">
          <span style="font-weight: 600">shadcn</span>
          <span style="font-size: 0.75rem; color: var(--np-muted-foreground)"
            >@shadcn</span
          >
        </div>
        <span class="np-badge np-badge-success">Verified</span>
      </div>
      <p style="margin: 0">
        Building components and tools for designers and developers.
      </p>
      <div class="np-separator" role="separator"></div>
      <div
        style="
          display: flex;
          gap: 1rem;
          font-size: 0.75rem;
          color: var(--np-muted-foreground);
        "
      >
        <span
          ><strong style="color: var(--np-foreground)">12</strong>
          Following</span
        >
        <span
          ><strong style="color: var(--np-foreground)">96.4k</strong>
          Followers</span
        >
      </div>
    </div>
  </div>
</div>
