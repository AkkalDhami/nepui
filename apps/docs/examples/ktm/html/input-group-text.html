<div style="display: grid; gap: 1.5rem; width: 100%; max-width: 24rem">
  <div class="np-input-group" role="group">
    <div class="np-input-group-addon" role="group">
      <span class="np-input-group-text">$</span>
    </div>
    <input
      class="np-input np-input-group-input"
      placeholder="0.00"
      aria-label="Amount"
    />
    <div class="np-input-group-addon np-input-group-addon-end" role="group">
      <span class="np-input-group-text">USD</span>
    </div>
  </div>

  <div class="np-input-group" role="group">
    <div class="np-input-group-addon" role="group">
      <span class="np-input-group-text">https://</span>
    </div>
    <input
      class="np-input np-input-group-input"
      placeholder="example.com"
      aria-label="Domain"
    />
    <div class="np-input-group-addon np-input-group-addon-end" role="group">
      <span class="np-input-group-text">.com</span>
    </div>
  </div>

  <div class="np-input-group" role="group">
    <input
      class="np-input np-input-group-input"
      placeholder="Enter your username"
      aria-label="Username"
    />
    <div class="np-input-group-addon np-input-group-addon-end" role="group">
      <span class="np-input-group-text">@company.com</span>
    </div>
  </div>
</div>
