<div class="np-tabs np-tabs-vertical" style="width: 100%; max-width: 24rem">
  <div
    class="np-tabs-list"
    role="tablist"
    aria-orientation="vertical"
    aria-label="Settings"
  >
    <button
      type="button"
      class="np-tabs-trigger"
      role="tab"
      id="tabs-vertical-account"
      aria-selected="true"
      aria-controls="tabs-vertical-account-panel"
    >
      Account
    </button>
    <button
      type="button"
      class="np-tabs-trigger"
      role="tab"
      id="tabs-vertical-password"
      aria-selected="false"
      aria-controls="tabs-vertical-password-panel"
      tabindex="-1"
    >
      Password
    </button>
    <button
      type="button"
      class="np-tabs-trigger"
      role="tab"
      id="tabs-vertical-notifications"
      aria-selected="false"
      aria-controls="tabs-vertical-notifications-panel"
      tabindex="-1"
    >
      Notifications
    </button>
  </div>
  <div
    class="np-tabs-content"
    role="tabpanel"
    id="tabs-vertical-account-panel"
    aria-labelledby="tabs-vertical-account"
    tabindex="0"
  >
    Make changes to your account here.
  </div>
  <div
    class="np-tabs-content"
    role="tabpanel"
    id="tabs-vertical-password-panel"
    aria-labelledby="tabs-vertical-password"
    tabindex="0"
    hidden
  >
    Change your password here.
  </div>
  <div
    class="np-tabs-content"
    role="tabpanel"
    id="tabs-vertical-notifications-panel"
    aria-labelledby="tabs-vertical-notifications"
    tabindex="0"
    hidden
  >
    Configure your notification preferences.
  </div>
</div>
