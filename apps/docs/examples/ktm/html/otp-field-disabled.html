<link rel="stylesheet" href="./styles/field.css" />

<div style="display: grid; place-items: center">
  <div class="np-field" data-disabled>
    <label class="np-field-label" id="otp-disabled-label" for="otp-disabled"
      >Verification code</label
    >
    <div class="np-otp-field" role="group" aria-labelledby="otp-disabled-label">
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="1"
        disabled
        autocomplete="one-time-code"
        id="otp-disabled"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="2"
        disabled
        aria-label="Character 2 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="3"
        disabled
        aria-label="Character 3 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="4"
        disabled
        aria-label="Character 4 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="5"
        disabled
        aria-label="Character 5 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="6"
        disabled
        aria-label="Character 6 of 6"
      />
    </div>
  </div>
</div>
