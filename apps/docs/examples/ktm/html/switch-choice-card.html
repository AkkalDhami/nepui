<div
  style="
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 24rem;
  "
>
  <label class="np-field-label" for="sw-card-share">
    <span class="np-field np-field-horizontal">
      <span class="np-field-content">
        <span class="np-field-title">Share across devices</span>
        <span class="np-field-description"
          >Focus is shared across devices, and turns off when you leave the
          app.</span
        >
      </span>
      <input
        class="np-switch"
        type="checkbox"
        role="switch"
        id="sw-card-share"
      />
    </span>
  </label>
  <label class="np-field-label" for="sw-card-notify">
    <span class="np-field np-field-horizontal">
      <span class="np-field-content">
        <span class="np-field-title">Enable notifications</span>
        <span class="np-field-description"
          >Receive notifications when focus mode is enabled or disabled.</span
        >
      </span>
      <input
        class="np-switch"
        type="checkbox"
        role="switch"
        id="sw-card-notify"
        checked
      />
    </span>
  </label>
</div>
