<div style="width: 100%; max-width: 24rem">
  <div class="np-input-group" role="group">
    <textarea
      class="np-textarea np-input-group-textarea"
      placeholder="console.log('Hello, world!');"
      aria-label="Code editor"
      style="
        min-height: 7rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      "
    ></textarea>

    <div
      class="np-input-group-addon np-input-group-addon-block-start"
      role="group"
      style="padding-bottom: 0.5rem; border-bottom: 1px solid var(--np-border)"
    >
      <span
        class="np-input-group-text"
        style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace"
      >
        script.js
      </span>
    </div>

    <div
      class="np-input-group-addon np-input-group-addon-block-end"
      role="group"
      style="padding-top: 0.5rem; border-top: 1px solid var(--np-border)"
    >
      <span class="np-input-group-text">Line 1, Column 1</span>
      <button
        class="np-button np-button-sm np-input-group-button"
        type="button"
        style="margin-left: auto"
      >
        Run
      </button>
    </div>
  </div>
</div>
