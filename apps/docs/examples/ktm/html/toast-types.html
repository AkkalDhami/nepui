<div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
  <button
    class="np-button np-button-outline"
    type="button"
    data-np-toast-trigger
    data-toast-title="Event created"
    data-toast-description="Sunday, December 3 at 9:00 AM"
  >
    Default
  </button>
  <button
    class="np-button np-button-outline"
    type="button"
    data-np-toast-trigger
    data-toast-type="success"
    data-toast-title="Event created"
    data-toast-description="Sunday, December 3 at 9:00 AM"
  >
    Success
  </button>
  <button
    class="np-button np-button-outline"
    type="button"
    data-np-toast-trigger
    data-toast-type="info"
    data-toast-title="Be at the area 10 minutes before"
    data-toast-description="The venue opens at 8:50 AM."
  >
    Info
  </button>
  <button
    class="np-button np-button-outline"
    type="button"
    data-np-toast-trigger
    data-toast-type="warning"
    data-toast-title="Event starts in 10 minutes"
    data-toast-description="Sunday, December 3 at 9:00 AM"
  >
    Warning
  </button>
  <button
    class="np-button np-button-outline"
    type="button"
    data-np-toast-trigger
    data-toast-type="error"
    data-toast-title="Event failed to create"
    data-toast-description="Please try again."
  >
    Error
  </button>
</div>
