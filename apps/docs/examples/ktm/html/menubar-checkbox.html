<div class="np-menubar" role="menubar" aria-label="Application menu">
  <div class="np-menubar-menu">
    <button
      class="np-menubar-trigger"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      View
    </button>
    <div class="np-menubar-content" role="menu" hidden>
      <div role="group">
        <div class="np-menubar-label" role="presentation">Appearance</div>
        <div
          class="np-menubar-checkbox-item"
          role="menuitemcheckbox"
          aria-checked="true"
          tabindex="-1"
          data-checked
        >
          <span class="np-menubar-item-indicator"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6 9 17l-5-5" /></svg
          ></span>
          Bookmarks Bar
        </div>
        <div
          class="np-menubar-checkbox-item"
          role="menuitemcheckbox"
          aria-checked="false"
          tabindex="-1"
        >
          <span class="np-menubar-item-indicator"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6 9 17l-5-5" /></svg
          ></span>
          Full URLs
        </div>
      </div>
    </div>
  </div>
  <div class="np-menubar-menu">
    <button
      class="np-menubar-trigger"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      Format
    </button>
    <div class="np-menubar-content" role="menu" hidden>
      <div role="group">
        <div class="np-menubar-label" role="presentation">Text</div>
        <div
          class="np-menubar-checkbox-item"
          role="menuitemcheckbox"
          aria-checked="true"
          tabindex="-1"
          data-checked
        >
          <span class="np-menubar-item-indicator"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6 9 17l-5-5" /></svg
          ></span>
          Strikethrough
        </div>
        <div
          class="np-menubar-checkbox-item"
          role="menuitemcheckbox"
          aria-checked="false"
          tabindex="-1"
        >
          <span class="np-menubar-item-indicator"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6 9 17l-5-5" /></svg
          ></span>
          Code
        </div>
      </div>
    </div>
  </div>
</div>
