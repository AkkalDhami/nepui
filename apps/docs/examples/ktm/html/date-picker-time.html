<div style="display: flex; gap: 1rem">
  <div style="display: flex; flex-direction: column; gap: 0.75rem">
    <label class="np-label" for="date-picker">Date</label>
    <div
      data-np-date-picker
      data-id="date-picker"
      data-placeholder="Select date"
      style="--np-date-picker-width: 8.5rem"
    ></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 0.75rem">
    <label class="np-label" for="time-picker">Time</label>
    <input
      class="np-input"
      id="time-picker"
      type="time"
      step="1"
      value="10:30:00"
      style="width: 8.5rem"
    />
  </div>
</div>
