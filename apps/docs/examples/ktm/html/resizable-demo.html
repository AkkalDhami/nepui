<div
  class="np-resizable"
  style="
    width: 100%;
    max-width: 28rem;
    height: 12.5rem;
    border: 1px solid var(--np-border);
    border-radius: var(--np-radius-lg);
  "
>
  <div class="np-resizable-panel" data-default-size="50">
    <div
      style="
        display: flex;
        box-sizing: border-box;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      "
    >
      <span style="font-weight: 600">One</span>
    </div>
  </div>
  <div
    class="np-resizable-handle"
    role="separator"
    tabindex="0"
    aria-label="Resize"
  >
    <div class="np-resizable-grip"></div>
  </div>
  <div class="np-resizable-panel" data-default-size="50">
    <div class="np-resizable np-resizable-vertical">
      <div class="np-resizable-panel" data-default-size="25">
        <div
          style="
            display: flex;
            box-sizing: border-box;
            height: 100%;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
          "
        >
          <span style="font-weight: 600">Two</span>
        </div>
      </div>
      <div
        class="np-resizable-handle"
        role="separator"
        tabindex="0"
        aria-label="Resize"
      >
        <div class="np-resizable-grip"></div>
      </div>
      <div class="np-resizable-panel" data-default-size="75">
        <div
          style="
            display: flex;
            box-sizing: border-box;
            height: 100%;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
          "
        >
          <span style="font-weight: 600">Three</span>
        </div>
      </div>
    </div>
  </div>
</div>
