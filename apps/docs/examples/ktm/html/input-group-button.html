<div style="display: grid; gap: 1.5rem; width: 100%; max-width: 24rem">
  <div class="np-input-group" role="group">
    <input
      class="np-input np-input-group-input"
      value="https://nepui.vercel.app"
      readonly
      aria-label="Share link"
    />
    <div class="np-input-group-addon np-input-group-addon-end" role="group">
      <button
        class="np-button np-button-ghost np-button-xs np-input-group-button"
        type="button"
      >
        Copy
      </button>
    </div>
  </div>

  <div class="np-input-group" role="group">
    <input
      class="np-input np-input-group-input"
      value="https://nepui.vercel.app"
      readonly
      aria-label="Share link"
    />
    <div class="np-input-group-addon np-input-group-addon-end" role="group">
      <button
        class="np-button np-button-ghost np-button-icon-xs np-input-group-button"
        type="button"
        aria-label="Copy"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
      </button>
    </div>
  </div>

  <div class="np-input-group" role="group">
    <div class="np-input-group-addon" role="group">
      <button
        class="np-button np-button-outline np-button-icon-xs np-input-group-button"
        type="button"
        aria-label="Info"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        </svg>
      </button>
    </div>
    <input
      class="np-input np-input-group-input"
      placeholder="Enter search query"
      aria-label="Search"
    />
    <div class="np-input-group-addon np-input-group-addon-end" role="group">
      <span class="np-input-group-text">Searching...</span>
    </div>
    <div class="np-input-group-addon np-input-group-addon-end" role="group">
      <button
        class="np-button np-button-secondary np-button-xs np-input-group-button"
        type="button"
      >
        Search
      </button>
    </div>
  </div>
</div>
