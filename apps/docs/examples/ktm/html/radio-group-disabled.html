<div
  class="np-radio-group"
  role="radiogroup"
  aria-label="Plan"
  style="width: fit-content"
>
  <div class="np-field np-field-horizontal">
    <input
      class="np-radio-group-item"
      type="radio"
      name="dis-plan"
      id="dis-r1"
      value="free"
      checked
    />
    <label class="np-field-label" for="dis-r1">Free</label>
  </div>

  <div class="np-field np-field-horizontal" data-disabled>
    <input
      class="np-radio-group-item"
      type="radio"
      name="dis-plan"
      id="dis-r2"
      value="pro"
      disabled
    />
    <label class="np-field-label" for="dis-r2">Pro</label>
  </div>

  <div class="np-field np-field-horizontal" data-disabled>
    <input
      class="np-radio-group-item"
      type="radio"
      name="dis-plan"
      id="dis-r3"
      value="enterprise"
      disabled
    />
    <label class="np-field-label" for="dis-r3">Enterprise</label>
  </div>
</div>
