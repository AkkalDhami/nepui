<div
  style="
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1rem;
  "
>
  <div
    class="np-toggle-group np-toggle-group-outline np-toggle-group-connected np-toggle-group-sm"
    role="group"
    aria-label="Small alignment"
  >
    <button type="button" class="np-toggle" aria-pressed="true" value="top">
      Top
    </button>
    <button type="button" class="np-toggle" aria-pressed="false" value="bottom">

    </button>
    <button type="button" class="np-toggle" aria-pressed="false" value="left">

  <div
    class="np-toggle-group np-toggle-group-outline np-toggle-group-connected"

      Top
    </button>
    <button type="button" class="np-toggle" aria-pressed="false" value="bottom">

    </button>

      Left
    </button>

      Right

  </div>

  <div
    class="np-toggle-group np-toggle-group-outline np-toggle-group-connected np-toggle-group-lg"
    role="group"
    aria-label="Large alignment"
  >
    <button type="button" class="np-toggle" aria-pressed="true" value="top">
      Top
    </button>
    <button type="button" class="np-toggle" aria-pressed="false" value="bottom">
      Bottom
    </button>
    <button type="button" class="np-toggle" aria-pressed="false" value="left">

      Right
