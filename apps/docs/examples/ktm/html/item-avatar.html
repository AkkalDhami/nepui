<div
  style="
    display: flex;
    width: 100%;
    max-width: 28rem;
    flex-direction: column;
    gap: 1rem;
  "
>
  <div class="np-item np-item-outline">
    <div class="np-item-media">
      <span class="np-avatar np-avatar-lg">
        <img
          class="np-avatar-image"
          src="https://github.com/akkaldhami.png"
          alt="Akkal Dhami"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">AD</span>
      </span>
    </div>
    <div class="np-item-content">
      <div class="np-item-title">Akkal Dhami</div>
      <p class="np-item-description">Last seen 5 months ago</p>
    </div>
    <div class="np-item-actions">
      <button
        class="np-button np-button-outline np-button-icon-sm"
        type="button"
        aria-label="Invite"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
      </button>
    </div>
  </div>
  <div class="np-item np-item-outline">
    <div class="np-item-media">
      <div class="np-avatar-group">
        <span class="np-avatar">
          <img
            class="np-avatar-image"
            src="https://github.com/pratapchaulagain.png"
            alt="@pratapchaulagain"
            onerror="this.hidden = true"
          />
          <span class="np-avatar-fallback">CN</span>
        </span>
        <span class="np-avatar">
          <img
            class="np-avatar-image"
            src="https://github.com/manisbhusal.png"
            alt="@manisbhusal"
            onerror="this.hidden = true"
          />
          <span class="np-avatar-fallback">LR</span>
        </span>
        <span class="np-avatar">
          <img
            class="np-avatar-image"
            src="https://github.com/akkaldhami.png"
            alt="@akkaldhami"
            onerror="this.hidden = true"
          />
          <span class="np-avatar-fallback">AD</span>
        </span>
      </div>
    </div>
    <div class="np-item-content">
      <div class="np-item-title">No Team Members</div>
      <p class="np-item-description">
        Invite your team to collaborate on this project.
      </p>
    </div>
    <div class="np-item-actions">
      <button class="np-button np-button-outline np-button-sm" type="button">
        Invite
      </button>
    </div>
  </div>
</div>
