<div
  style="
    display: grid;
    max-width: 32rem;
    grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
    gap: 0.75rem;
  "
>
  <div
    class="np-aurora"
    data-gradient="forest"
    data-mask="center"
    data-intensity="subtle"
    style="
      display: grid;
      place-items: center;
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">Subtle</strong>
  </div>
  <div
    class="np-aurora"
    data-gradient="forest"
    data-mask="center"
    style="
      display: grid;
      place-items: center;
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">Default</strong>
  </div>
  <div
    class="np-aurora"
    data-gradient="forest"
    data-mask="center"
    data-intensity="strong"
    data-speed="fast"
    style="
      display: grid;
      place-items: center;
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">Strong and fast</strong>
  </div>
  <div
    class="np-aurora"
    data-gradient="forest"
    data-mask="center"
    data-animate="false"
    style="
      display: grid;
      place-items: center;
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">Still</strong>
  </div>
</div>
