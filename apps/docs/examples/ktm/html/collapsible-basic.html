<details class="np-collapsible" style="width: 100%; max-width: 20rem">
  <summary
    class="np-collapsible-trigger np-button np-button-outline np-button-sm"
    style="width: 100%; justify-content: space-between"
  >
    Product details
    <svg
      class="np-collapsible-icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      width="16"
      height="16"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </summary>
  <div class="np-collapsible-content">
    <p
      style="
        margin: 0;
        padding-top: 0.75rem;
        font-size: 0.875rem;
        color: var(--np-muted-foreground);
      "
    >
      This product has a lightweight aluminum frame, a 14-hour battery and a
      two-year warranty. It ships in recyclable packaging.
    </p>
  </div>
