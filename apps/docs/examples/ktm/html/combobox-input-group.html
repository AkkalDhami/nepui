<link rel="stylesheet" href="./styles/button.css" />
<link rel="stylesheet" href="./styles/input.css" />
<link rel="stylesheet" href="./styles/input-group.css" />

<div class="np-combobox" style="width: 100%; max-width: 16rem">
  <div class="np-input-group">
    <div class="np-input-group-addon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
        <path d="M2 12h20" />
      </svg>
    </div>
    <input
      class="np-input np-input-group-input"
      placeholder="Select a country"
      aria-label="Country"
    />
    <div class="np-input-group-addon np-input-group-addon-end">
      <button
        type="button"
        class="np-button np-button-ghost np-button-icon-xs np-input-group-button np-combobox-trigger"
        aria-label="Open options"
      ></button>
    </div>
  </div>
  <div class="np-combobox-content">
    <div class="np-combobox-empty">No items found.</div>
    <div class="np-combobox-list">
      <div class="np-combobox-item">Nepal</div>
      <div class="np-combobox-item">India</div>
      <div class="np-combobox-item">Japan</div>
      <div class="np-combobox-item">France</div>
      <div class="np-combobox-item">Brazil</div>
      <div class="np-combobox-item">Kenya</div>
    </div>
  </div>
</div>
