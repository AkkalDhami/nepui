<div style="width: 100%; max-width: 28rem; display: grid; gap: 2.5rem">
  <div class="np-bubble np-bubble-end">
    <div class="np-bubble-content">Hey there! what's up?</div>
  </div>
  <div class="np-bubble-group">
    <div class="np-bubble np-bubble-secondary">
      <div class="np-bubble-content">Hey! Want to see chat bubbles?</div>
    </div>
    <div class="np-bubble np-bubble-secondary">
      <div class="np-bubble-content">
        I can group messages, switch sides, and keep the whole thread easy to
        scan.
      </div>
      <div
        class="np-bubble-reactions"
        role="img"
        aria-label="Reaction: thumbs up"
      >
        <span>👍</span>
      </div>
    </div>
  </div>
  <div class="np-bubble np-bubble-end">
    <div class="np-bubble-content">Sure. Hit me with your best demo.</div>
  </div>
  <div class="np-bubble np-bubble-secondary">
    <div class="np-bubble-content">
      Yes. You are reading a demo that is demoing itself. Very meta. Very
      on-brand.
    </div>
    <div
      class="np-bubble-reactions"
      role="img"
      aria-label="Reactions: thumbs up, fire, eyes, and 2 more"
    >
      <span>👍</span>
      <span>🔥</span>
      <span>👀</span>
      <span>+2</span>
    </div>
  </div>
</div>
