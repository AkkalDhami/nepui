<button
  class="np-button np-button-outline np-button-icon-sm"
  type="button"
  aria-label="Copy"
  onclick="
    const b = this,
      i = b.querySelectorAll('.np-icon-swap-item')
    i[0].toggleAttribute('data-active', false)
    i[1].toggleAttribute('data-active', true)
    b.setAttribute('aria-label', 'Copied')
    clearTimeout(b._t)
    b._t = setTimeout(() => {
      i[0].toggleAttribute('data-active', true)
      i[1].toggleAttribute('data-active', false)
      b.setAttribute('aria-label', 'Copy')
    }, 1000)
  "
>
  <span class="np-icon-swap">
    <span class="np-icon-swap-item" data-active
      ><svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path
          d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
        /></svg
    ></span>
    <span class="np-icon-swap-item"
      ><svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20 6 9 17l-5-5" /></svg
    ></span>
  </span>
</button>
