<div
  style="
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    width: 100%;
    max-width: 24rem;
  "
>
  <div class="np-meter np-meter-sm">
    <label class="np-meter-label" for="meter-size-sm">Small</label>
    <span class="np-meter-value">40%</span>
    <meter
      class="np-meter-track"
      id="meter-size-sm"
      value="40"
      min="0"
      max="100"
    >
      40%
    </meter>
  </div>

  <div class="np-meter">
    <label class="np-meter-label" for="meter-size-default">Default</label>
    <span class="np-meter-value">60%</span>
    <meter
      class="np-meter-track"
      id="meter-size-default"
      value="60"
      min="0"
      max="100"
    >
      60%
    </meter>
  </div>

  <div class="np-meter np-meter-lg">
    <label class="np-meter-label" for="meter-size-lg">Large</label>
    <span class="np-meter-value">80%</span>
    <meter
      class="np-meter-track"
      id="meter-size-lg"
      value="80"
      min="0"
      max="100"
    >
      80%
    </meter>
  </div>
</div>
