<link rel="stylesheet" href="./styles/field.css" />

<div style="width: 100%; max-width: 24rem">
  <div class="np-field">
    <label class="np-field-label" for="password-input-actions"
      >New password</label
    >
    <div class="np-password-input">
      <input
        class="np-password-input-control"
        id="password-input-actions"
        type="password"
        autocomplete="new-password"
        spellcheck="false"
        autocapitalize="off"
      />
      <button
        class="np-password-input-action"
        type="button"
        data-action="generate"
        data-length="16"
        aria-label="Generate password"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
      </button>
      <button
        class="np-password-input-action"
        type="button"
        data-action="copy"
        aria-label="Copy password"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
      </button>
      <button
        class="np-password-input-toggle"
        type="button"
        aria-label="Show password"
        aria-pressed="false"
      >
        <svg
          class="np-password-input-icon-show"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <svg
          class="np-password-input-icon-hide"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
          />
          <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
          <path
            d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
          />
          <path d="m2 2 20 20" />
        </svg>
      </button>
    </div>
    <div
      class="np-password-input-strength"
      role="meter"
      aria-label="Password strength"
      aria-valuemin="0"
      aria-valuemax="4"
      aria-valuenow="0"
      aria-valuetext="Enter a password"
      data-level="0"
    >
      <div class="np-password-input-strength-bars" aria-hidden="true">
        <span class="np-password-input-strength-bar"></span>
        <span class="np-password-input-strength-bar"></span>
        <span class="np-password-input-strength-bar"></span>
        <span class="np-password-input-strength-bar"></span>
      </div>
      <span class="np-password-input-strength-label">Enter a password</span>
    </div>
    <p class="np-field-description">
      Generate a random password, then copy it.
    </p>
  </div>
</div>
