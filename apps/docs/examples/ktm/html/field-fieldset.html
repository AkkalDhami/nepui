<div style="width: 100%; max-width: 24rem">
  <fieldset class="np-field-set">
    <legend class="np-field-legend">Address Information</legend>
    <p class="np-field-description">
      We need your address to deliver your order.
    </p>
    <div class="np-field-group">
      <div class="np-field" role="group">
        <label class="np-field-label" for="street">Street Address</label>
        <input
          id="street"
          class="np-input"
          type="text"
          placeholder="123 Main St"
        />
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem">
        <div class="np-field" role="group">
          <label class="np-field-label" for="city">City</label>
          <input
            id="city"
            class="np-input"
            type="text"
            placeholder="New York"
          />
        </div>
        <div class="np-field" role="group">
          <label class="np-field-label" for="zip">Postal Code</label>
          <input id="zip" class="np-input" type="text" placeholder="90502" />
        </div>
      </div>
    </div>
  </fieldset>
</div>
