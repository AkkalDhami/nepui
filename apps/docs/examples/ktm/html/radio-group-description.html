<div
  class="np-radio-group"
  role="radiogroup"
  aria-label="Density"
  style="width: 100%; max-width: 20rem"
>
  <div class="np-field np-field-horizontal">
    <input
      class="np-radio-group-item"
      type="radio"
      name="desc-density"
      id="desc-r1"
      value="default"
    />
    <div class="np-field-content">
      <label class="np-field-label" for="desc-r1">Default</label>
      <p class="np-field-description">Standard spacing for most use cases.</p>
    </div>
  </div>

  <div class="np-field np-field-horizontal">
    <input
      class="np-radio-group-item"
      type="radio"
      name="desc-density"
      id="desc-r2"
      value="comfortable"
      checked
    />
    <div class="np-field-content">
      <label class="np-field-label" for="desc-r2">Comfortable</label>
      <p class="np-field-description">More space between elements.</p>
    </div>
  </div>

  <div class="np-field np-field-horizontal">
    <input
      class="np-radio-group-item"
      type="radio"
      name="desc-density"
      id="desc-r3"
      value="compact"
    />
    <div class="np-field-content">
      <label class="np-field-label" for="desc-r3">Compact</label>
      <p class="np-field-description">Minimal spacing for dense layouts.</p>
    </div>
  </div>
</div>
