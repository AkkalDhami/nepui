<div
  class="np-color-picker"
  aria-label="Color"
  data-space="srgb"
  data-default-value="rgb(59 130 246)"
>
  <div class="np-color-picker-area"></div>
  <div class="np-color-picker-slider"></div>
  <div class="np-color-picker-row">
    <div class="np-color-picker-swatch"></div>
    <input class="np-color-picker-channel-input" data-channel="red" />
    <input class="np-color-picker-channel-input" data-channel="green" />
    <input class="np-color-picker-channel-input" data-channel="blue" />
  </div>
  <div class="np-color-picker-swatches" aria-label="Preset colors">
    <button class="np-color-picker-swatch-item" data-value="#ef4444"></button>
    <button class="np-color-picker-swatch-item" data-value="#f97316"></button>
    <button class="np-color-picker-swatch-item" data-value="#eab308"></button>
    <button class="np-color-picker-swatch-item" data-value="#22c55e"></button>
    <button class="np-color-picker-swatch-item" data-value="#06b6d4"></button>
    <button class="np-color-picker-swatch-item" data-value="#3b82f6"></button>
    <button class="np-color-picker-swatch-item" data-value="#8b5cf6"></button>
    <button class="np-color-picker-swatch-item" data-value="#ec4899"></button>
  </div>
</div>
