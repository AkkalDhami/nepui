<link rel="stylesheet" href="./styles/button.css" />

<div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
  <button
    class="np-button np-button-outline np-button-sm"
    type="button"
    popovertarget="popover-side-top"
  >
    Top
  </button>
  <div
    id="popover-side-top"
    class="np-popover"
    popover
    data-side="top"
    style="width: 10rem"
  >
    <div class="np-popover-header">
      <h2 class="np-popover-title">Top</h2>
      <p class="np-popover-description">Opens above the trigger.</p>
    </div>
  </div>
  <button
    class="np-button np-button-outline np-button-sm"
    type="button"
    popovertarget="popover-side-right"
  >
    Right
  </button>
  <div
    id="popover-side-right"
    class="np-popover"
    popover
    data-side="right"
    style="width: 10rem"
  >
    <div class="np-popover-header">
      <h2 class="np-popover-title">Right</h2>
      <p class="np-popover-description">Opens to the right.</p>
    </div>
  </div>
  <button
    class="np-button np-button-outline np-button-sm"
    type="button"
    popovertarget="popover-side-bottom"
  >
    Bottom
  </button>
  <div
    id="popover-side-bottom"
    class="np-popover"
    popover
    data-side="bottom"
    style="width: 10rem"
  >
    <div class="np-popover-header">
      <h2 class="np-popover-title">Bottom</h2>
      <p class="np-popover-description">Opens below the trigger.</p>
    </div>
  </div>
  <button
    class="np-button np-button-outline np-button-sm"
    type="button"
    popovertarget="popover-side-left"
  >
    Left
  </button>
  <div
    id="popover-side-left"
    class="np-popover"
    popover
    data-side="left"
    style="width: 10rem"
  >
    <div class="np-popover-header">
      <h2 class="np-popover-title">Left</h2>
      <p class="np-popover-description">Opens to the left.</p>
    </div>
  </div>
</div>
