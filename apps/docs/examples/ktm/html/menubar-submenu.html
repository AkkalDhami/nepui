<div class="np-menubar" role="menubar" aria-label="Application menu">
  <div class="np-menubar-menu">
    <button
      class="np-menubar-trigger"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      File
    </button>
    <div class="np-menubar-content" role="menu" hidden>
      <div role="group">
        <div class="np-menubar-item" role="menuitem" tabindex="-1">
          New Tab <span class="np-menubar-shortcut">⌘T</span>
        </div>
      </div>
      <div class="np-menubar-separator" role="separator"></div>
      <div class="np-menubar-sub">
        <div
          class="np-menubar-sub-trigger"
          role="menuitem"
          tabindex="-1"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          Share
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </div>
        <div
          class="np-menubar-content np-menubar-sub-content"
          role="menu"
          hidden
        >
          <div role="group">
            <div class="np-menubar-item" role="menuitem" tabindex="-1">
              Email link
            </div>
            <div class="np-menubar-item" role="menuitem" tabindex="-1">
              Messages
            </div>
            <div class="np-menubar-item" role="menuitem" tabindex="-1">
              Notes
            </div>
          </div>
        </div>
      </div>
      <div class="np-menubar-separator" role="separator"></div>
      <div role="group">
        <div class="np-menubar-item" role="menuitem" tabindex="-1">
          Print <span class="np-menubar-shortcut">⌘P</span>
        </div>
      </div>
    </div>
  </div>
  <div class="np-menubar-menu">
    <button
      class="np-menubar-trigger"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      Edit
    </button>
    <div class="np-menubar-content" role="menu" hidden>
      <div role="group">
        <div class="np-menubar-item" role="menuitem" tabindex="-1">
          Undo <span class="np-menubar-shortcut">⌘Z</span>
        </div>
        <div class="np-menubar-item" role="menuitem" tabindex="-1">
          Redo <span class="np-menubar-shortcut">⇧⌘Z</span>
        </div>
      </div>
      <div class="np-menubar-separator" role="separator"></div>
      <div class="np-menubar-sub">
        <div
          class="np-menubar-sub-trigger"
          role="menuitem"
          tabindex="-1"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          Find
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </div>
        <div
          class="np-menubar-content np-menubar-sub-content"
          role="menu"
          hidden
        >
          <div role="group">
            <div class="np-menubar-item" role="menuitem" tabindex="-1">
              Search the web
            </div>
            <div class="np-menubar-item" role="menuitem" tabindex="-1">
              Find...
            </div>
            <div class="np-menubar-item" role="menuitem" tabindex="-1">
              Find Next
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
