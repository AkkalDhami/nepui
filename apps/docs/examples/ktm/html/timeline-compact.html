<div
  class="np-timeline"
  aria-label="Roadmap"
  style="
    width: 100%;
    max-width: 20rem;
    --np-timeline-marker-size: 0.75rem;
    --np-timeline-item-gap: 1rem;
  "
>
  <div class="np-timeline-item">
    <span
      class="np-timeline-marker"
      style="background: #10b981; border-color: #10b981"
    ></span>
    <span class="np-timeline-connector"></span>
    <div class="np-timeline-title" style="line-height: 0.75rem">
      Beta Program
    </div>
    <time
      class="np-timeline-time"
      style="text-transform: uppercase; font-weight: 600"
      >Dec 15, 2025</time
    >
  </div>
  <div class="np-timeline-item">
    <span
      class="np-timeline-marker"
      style="background: #8b5cf6; border-color: #8b5cf6"
    ></span>
    <span class="np-timeline-connector"></span>
    <div class="np-timeline-title" style="line-height: 0.75rem">
      Usability Testing
    </div>
    <time
      class="np-timeline-time"
      style="text-transform: uppercase; font-weight: 600"
      >Nov 01, 2025</time
    >
  </div>
  <div class="np-timeline-item">
    <span
      class="np-timeline-marker"
      style="background: #d946ef; border-color: #d946ef"
    ></span>
    <span class="np-timeline-connector"></span>
    <div class="np-timeline-title" style="line-height: 0.75rem">
      Design Phase
    </div>
    <time
      class="np-timeline-time"
      style="text-transform: uppercase; font-weight: 600"
      >Oct 15, 2025</time
    >
  </div>
  <div class="np-timeline-item">
    <span
      class="np-timeline-marker"
      style="background: #3b82f6; border-color: #3b82f6"
    ></span>
    <span class="np-timeline-connector"></span>
    <div class="np-timeline-title" style="line-height: 0.75rem">
      Requirements Gathering
    </div>
    <time
      class="np-timeline-time"
      style="text-transform: uppercase; font-weight: 600"
      >Aug 01, 2024</time
    >
  </div>
</div>
