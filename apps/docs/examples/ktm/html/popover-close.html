<link rel="stylesheet" href="./styles/button.css" />

<button
  class="np-button np-button-outline"
  type="button"
  popovertarget="popover-demo-panel"
>
  Open popover
</button>

<div id="popover-demo-panel" class="np-popover" popover>
  <div class="np-popover-header">
    <h2 class="np-popover-title">Dimensions</h2>
    <p class="np-popover-description">Set the dimensions for the layer.</p>
  </div>

  <div class="np-popover-close">
    <button
      class="np-button np-button-sm np-button-outline"
      type="button"
      popovertarget="popover-demo-panel"
      popovertargetaction="hide"
      aria-label="Close"
      style="width: 100%"
    >
      close
    </button>
  </div>
</div>
