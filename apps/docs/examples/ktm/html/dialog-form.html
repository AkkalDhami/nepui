<button
  type="button"
  class="np-button np-button-outline"
  commandfor="dialog-form"
  command="show-modal"
>
  Edit Profile
</button>

<dialog
  id="dialog-form"
  class="np-dialog-content"
  closedby="any"
  aria-labelledby="dialog-form-title"
  aria-describedby="dialog-form-description"
>
  <div class="np-dialog-header">
    <h2 class="np-dialog-title" id="dialog-form-title">Edit profile</h2>
    <p class="np-dialog-description" id="dialog-form-description">
      Make changes to your profile here. Click save when you are done.
    </p>
  </div>
  <div style="display: grid; gap: 1rem">
    <div style="display: grid; gap: 0.5rem">
      <label class="np-label" for="dialog-form-name">Name</label>
      <input class="np-input" id="dialog-form-name" value="Jane Doe" />
    </div>
    <div style="display: grid; gap: 0.5rem">
      <label class="np-label" for="dialog-form-username">Username</label>
      <input class="np-input" id="dialog-form-username" value="@janedoe" />
    </div>
  </div>
  <div class="np-dialog-footer">
    <button
      type="button"
      class="np-button np-button-outline"
      commandfor="dialog-form"
      command="close"
    >
      Cancel
    </button>
    <button
      type="button"
      class="np-button"
      commandfor="dialog-form"
      command="close"
    >
      Save changes
    </button>
  </div>
  <button
    type="button"
    class="np-button np-button-ghost np-button-icon-sm np-dialog-close"
    commandfor="dialog-form"
    command="close"
    aria-label="Close"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </svg>
  </button>
</dialog>
