<div style="display: grid; gap: 0.625rem; width: 100%; max-width: 24rem">
  <label class="np-label" for="message">Message</label>
  <textarea
    id="message"
    class="np-textarea"
    placeholder="Type your message here."
    aria-describedby="message-hint"
  ></textarea>
  <p id="message-hint" style="margin: 0; font-size: 0.875rem">
    Your message will be copied to the support team.
  </p>
</div>
