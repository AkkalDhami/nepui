<link rel="stylesheet" href="./styles/label.css" />
<link rel="stylesheet" href="./styles/checkbox.css" />

<div
  class="np-checkbox-group"
  role="group"
  aria-labelledby="user-permissions-caption"
  oninput="
    var t = event.target
    function leaves(g) {
      return g.querySelectorAll('input:not([data-parent])')
    }
    if (t.hasAttribute('data-parent')) {
      leaves(t.closest('[role=group]')).forEach(function (i) {
        i.checked = t.checked
      })
    }
    this.querySelectorAll('[data-parent]').forEach(function (p) {
      var l = leaves(p.closest('[role=group]')),
        n = 0
      l.forEach(function (i) {
        if (i.checked) n++
      })
      p.checked = n === l.length
      p.indeterminate = n > 0 && n !== l.length
    })
  "
>
  <label class="np-label" id="user-permissions-caption"
    ><input class="np-checkbox" type="checkbox" data-parent />User
    Permissions</label
  >
  <label class="np-label np-checkbox-group-child"
    ><input class="np-checkbox" type="checkbox" value="view-dashboard" />View
    Dashboard</label
  >
  <label class="np-label np-checkbox-group-child"
    ><input class="np-checkbox" type="checkbox" value="access-reports" />Access
    Reports</label
  >
  <div
    class="np-checkbox-group np-checkbox-group-child"
    role="group"
    aria-labelledby="manage-users-caption"
  >
    <label class="np-label" id="manage-users-caption"
      ><input class="np-checkbox" type="checkbox" data-parent />Manage
      Users</label
    >
    <label class="np-label np-checkbox-group-child"
      ><input class="np-checkbox" type="checkbox" value="create-user" />Create
      User</label
    >
    <label class="np-label np-checkbox-group-child"
      ><input class="np-checkbox" type="checkbox" value="edit-user" />Edit
      User</label
    >
    <label class="np-label np-checkbox-group-child"
      ><input class="np-checkbox" type="checkbox" value="delete-user" />Delete
      User</label
    >
    <label class="np-label np-checkbox-group-child"
      ><input class="np-checkbox" type="checkbox" value="assign-roles" />Assign
      Roles</label
    >
  </div>
</div>
