<link rel="stylesheet" href="./styles/badge.css" />

<div style="width: 100%; max-width: 36rem">
  <div class="np-table-container">
    <table class="np-table">
      <caption class="np-table-caption">
        A list of your recent invoices.
      </caption>
      <thead class="np-table-header">
        <tr class="np-table-row">
          <th class="np-table-head" scope="col" style="width: 6.25rem">
            Invoice
          </th>
          <th class="np-table-head" scope="col">Status</th>
          <th class="np-table-head" scope="col">Method</th>
          <th class="np-table-head np-table-end" scope="col">Amount</th>
        </tr>
      </thead>
      <tbody class="np-table-body">
        <tr class="np-table-row">
          <td class="np-table-cell" style="font-weight: 500">INV001</td>
          <td class="np-table-cell">
            <span class="np-badge np-badge-success np-badge-light">Paid</span>
          </td>
          <td class="np-table-cell">Credit Card</td>
          <td class="np-table-cell np-table-end">$250.00</td>
        </tr>
        <tr class="np-table-row">
          <td class="np-table-cell" style="font-weight: 500">INV002</td>
          <td class="np-table-cell">
            <span class="np-badge np-badge-warning np-badge-light"
              >Pending</span
            >
          </td>
          <td class="np-table-cell">PayPal</td>
          <td class="np-table-cell np-table-end">$150.00</td>
        </tr>
        <tr class="np-table-row">
          <td class="np-table-cell" style="font-weight: 500">INV003</td>
          <td class="np-table-cell">
            <span class="np-badge np-badge-destructive np-badge-light"
              >Unpaid</span
            >
          </td>
          <td class="np-table-cell">Bank Transfer</td>
          <td class="np-table-cell np-table-end">$300.00</td>
        </tr>
        <tr class="np-table-row">
          <td class="np-table-cell" style="font-weight: 500">INV003</td>
          <td class="np-table-cell">
            <span class="np-badge np-badge-success np-badge-light">Paid</span>
          </td>
          <td class="np-table-cell">Bank Transfer</td>
          <td class="np-table-cell np-table-end">$100.00</td>
        </tr>
      </tbody>

      <tfoot class="np-table-footer">
        <tr class="np-table-row">
          <td class="np-table-cell" colspan="3">Total</td>
          <td class="np-table-cell np-table-end">$800.00</td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
