<div
  class="np-radio-group np-radio-group-horizontal"
  role="radiogroup"
  aria-label="Size"
  style="width: fit-content"
>
  <div style="display: flex; align-items: center; gap: 0.75rem">
    <input
      class="np-radio-group-item"
      type="radio"
      name="h-size"
      id="h-r1"
      value="sm"
    />
    <label class="np-label" for="h-r1">Small</label>
  </div>

  <div style="display: flex; align-items: center; gap: 0.75rem">
    <input
      class="np-radio-group-item"
      type="radio"
      name="h-size"
      id="h-r2"
      value="md"
      checked
    />
    <label class="np-label" for="h-r2">Medium</label>
  </div>

  <div style="display: flex; align-items: center; gap: 0.75rem">
    <input
      class="np-radio-group-item"
      type="radio"
      name="h-size"
      id="h-r3"
      value="lg"
    />
    <label class="np-label" for="h-r3">Large</label>
  </div>
</div>
