<link rel="stylesheet" href="./styles/button.css" />

<div
  style="
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    padding: 2.5rem 7rem;
  "
>
  <span class="np-tooltip">
    <button
      type="button"
      class="np-button np-button-outline"
      aria-describedby="tooltip-side-left"
    >
      Left
    </button>
    <span
      class="np-tooltip-content np-tooltip-left"
      id="tooltip-side-left"
      role="tooltip"
    >
      Add to library
      <span class="np-tooltip-arrow" aria-hidden="true"></span>
    </span>
  </span>
  <span class="np-tooltip">
    <button
      type="button"
      class="np-button np-button-outline"
      aria-describedby="tooltip-side-top"
    >
      Top
    </button>
    <span class="np-tooltip-content" id="tooltip-side-top" role="tooltip">
      Add to library
      <span class="np-tooltip-arrow" aria-hidden="true"></span>
    </span>
  </span>
  <span class="np-tooltip">
    <button
      type="button"
      class="np-button np-button-outline"
      aria-describedby="tooltip-side-bottom"
    >
      Bottom
    </button>
    <span
      class="np-tooltip-content np-tooltip-bottom"
      id="tooltip-side-bottom"
      role="tooltip"
    >
      Add to library
      <span class="np-tooltip-arrow" aria-hidden="true"></span>
    </span>
  </span>
  <span class="np-tooltip">
    <button
      type="button"
      class="np-button np-button-outline"
      aria-describedby="tooltip-side-right"
    >
      Right
    </button>
    <span
      class="np-tooltip-content np-tooltip-right"
      id="tooltip-side-right"
      role="tooltip"
    >
      Add to library
      <span class="np-tooltip-arrow" aria-hidden="true"></span>
    </span>
  </span>
</div>
