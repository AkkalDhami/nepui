<link rel="stylesheet" href="./styles/bubble.css" />
<link rel="stylesheet" href="./styles/avatar.css" />

<div class="np-message-group" style="width: 100%; max-width: 28rem">
  <div class="np-message">
    <div class="np-message-avatar"></div>
    <div class="np-message-content">
      <div class="np-message-header">Sabin</div>
      <div class="np-bubble np-bubble-secondary">
        <div class="np-bubble-content">I already checked the logs.</div>
      </div>
    </div>
  </div>
  <div class="np-message">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/sabin-gtm.png"
          alt="@sabin-gtm"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">SG</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-bubble np-bubble-secondary">
        <div class="np-bubble-content">
          Send the report to the team. Ping @shadcn if you need help.
        </div>
      </div>
      <div class="np-message-footer">Read Yesterday</div>
    </div>
  </div>
</div>
