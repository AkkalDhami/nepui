<div
  style="display: flex; flex-direction: column; align-items: center; gap: 1rem"
  onclick="
    const p = event.target.closest('[data-pick]')
    if (!p) return
    this.querySelectorAll('[data-icon]').forEach((i) =>
      i.toggleAttribute('data-active', i.dataset.icon === p.dataset.pick)
    )
    this.querySelectorAll('[data-pick]').forEach((b) => {
      b.classList.toggle('np-button-secondary', b === p)
      b.classList.toggle('np-button-ghost', b !== p)
    })
    this.querySelector('.np-button-icon-sm').setAttribute(
      'aria-label',
      p.dataset.pick
    )
  "
>
  <button
    class="np-button np-button-outline np-button-icon-sm"
    type="button"
    aria-label="sun"
  >
    <span class="np-icon-swap">
      <span class="np-icon-swap-item" data-icon="sun" data-active
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" /></svg
      ></span>
      <span class="np-icon-swap-item" data-icon="moon"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6.5 6.5 0 0 0 8.268 8.268c.344-.215.825-.003.803.401"
          /></svg
      ></span>
      <span class="np-icon-swap-item" data-icon="monitor"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect width="20" height="14" x="2" y="3" rx="2" />
          <path d="M8 21h8" />
          <path d="M12 17v4" /></svg
      ></span>
    </span>
  </button>

  <div
    role="group"
    aria-label="Icon"
    style="
      display: flex;
      gap: 2px;
      padding: 2px;
      border-radius: var(--np-radius-lg);
      box-shadow: 0 0 0 1px var(--np-border);
    "
  >
    <button
      class="np-button np-button-secondary np-button-xs"
      type="button"
      data-pick="sun"
    >
      Sun
    </button>
    <button
      class="np-button np-button-ghost np-button-xs"
      type="button"
      data-pick="moon"
    >
      Moon
    </button>
    <button
      class="np-button np-button-ghost np-button-xs"
      type="button"
      data-pick="monitor"
    >
      Monitor
    </button>
  </div>
</div>
