<link rel="stylesheet" href="./styles/empty.css" />

<div
  class="np-empty"
  style="
    width: 100%;
    max-width: 32rem;
    --np-empty-bg: linear-gradient(
      to bottom,
      color-mix(in oklab, var(--np-muted) 50%, transparent) 30%,
      var(--np-background)
    );
  "
>
  <div class="np-empty-header">
    <div class="np-empty-media np-empty-media-icon">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
      </svg>
    </div>
    <div class="np-empty-title">No Notifications</div>
    <p class="np-empty-description">
      You’re all caught up. New notifications will appear here.
    </p>
  </div>
  <div class="np-empty-content">
    <button class="np-button np-button-outline np-button-sm" type="button">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
      </svg>
      Refresh
    </button>
  </div>
</div>
