<div style="display: flex; flex-wrap: wrap; gap: 2rem">
  <div
    class="np-color-picker"
    aria-label="Disabled color"
    data-disabled
    data-default-value="#22c55e"
  >
    <div class="np-color-picker-area"></div>
    <div class="np-color-picker-slider"></div>
    <div class="np-color-picker-row">
      <div class="np-color-picker-swatch"></div>
      <input class="np-color-picker-input" />
    </div>
  </div>

  <div
    class="np-color-picker"
    aria-label="Read-only color"
    data-readonly
    data-default-value="#f97316"
  >
    <div class="np-color-picker-area"></div>
    <div class="np-color-picker-slider"></div>
    <div class="np-color-picker-row">
      <div class="np-color-picker-swatch"></div>
      <input class="np-color-picker-input" />
    </div>
  </div>
</div>
