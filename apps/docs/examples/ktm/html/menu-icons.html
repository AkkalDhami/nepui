<div class="np-menu" style="--np-menu-anchor: --menu-icons">
  <button
    class="np-button np-button-outline"
    type="button"
    popovertarget="menu-icons"
  >
    Open
  </button>

  <div
    id="menu-icons"
    class="np-menu-content"
    popover
    role="menu"
    aria-label="Account"
    style="width: 12rem"
  >
    <div class="np-menu-group" role="group">
      <button class="np-menu-item" type="button" role="menuitem">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        Profile
      </button>
      <button class="np-menu-item" type="button" role="menuitem">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect width="20" height="14" x="2" y="5" rx="2" />
          <line x1="2" x2="22" y1="10" y2="10" />
        </svg>
        Billing
      </button>
      <button class="np-menu-item" type="button" role="menuitem">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 7h-9" />
          <path d="M14 17H5" />
          <circle cx="17" cy="17" r="3" />
          <circle cx="7" cy="7" r="3" />
        </svg>
        Settings
      </button>
    </div>
    <div class="np-menu-separator" role="separator"></div>
    <button class="np-menu-item" type="button" role="menuitem">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" x2="9" y1="12" y2="12" />
      </svg>
      Log out
    </button>
  </div>
</div>
