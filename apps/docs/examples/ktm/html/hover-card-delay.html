<link rel="stylesheet" href="./styles/button.css" />

<div
  style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem"
>
  <div
    class="np-hover-card"
    style="--np-hover-card-delay: 100ms; --np-hover-card-close-delay: 100ms"
  >
    <a class="np-hover-card-trigger np-button np-button-outline" href="#"
      >Quick (100ms)</a
    >
    <div class="np-hover-card-content">
      <p style="margin: 0">Opens after 100ms and closes after 100ms.</p>
    </div>
  </div>
  <div
    class="np-hover-card"
    style="--np-hover-card-delay: 1000ms; --np-hover-card-close-delay: 500ms"
  >
    <a class="np-hover-card-trigger np-button np-button-outline" href="#"
      >Slow (1000ms)</a
    >
    <div class="np-hover-card-content">
      <p style="margin: 0">Opens after 1000ms and closes after 500ms.</p>
    </div>
  </div>
</div>
