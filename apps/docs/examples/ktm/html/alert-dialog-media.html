<link rel="stylesheet" href="./styles/button.css" />
<link rel="stylesheet" href="./styles/alert-dialog.css" />

<button
  class="np-button np-button-outline"
  type="button"
  commandfor="alert-dialog-media-dialog"
  command="show-modal"
>
  Share Project
</button>
<dialog
  id="alert-dialog-media-dialog"
  class="np-alert-dialog"
  role="alertdialog"
  aria-labelledby="alert-dialog-media-dialog-title"
  aria-describedby="alert-dialog-media-dialog-description"
>
  <div class="np-alert-dialog-header">
    <div class="np-alert-dialog-media">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M8 12h8" />
        <path d="M12 8v8" />
        <circle cx="12" cy="12" r="10" />
      </svg>
    </div>
    <h2 id="alert-dialog-media-dialog-title" class="np-alert-dialog-title">
      Share this project?
    </h2>
    <p
      id="alert-dialog-media-dialog-description"
      class="np-alert-dialog-description"
    >
      Anyone with the link will be able to view and edit this project.
    </p>
  </div>
  <div class="np-alert-dialog-footer">
    <button
      class="np-button np-button-outline"
      type="button"
      commandfor="alert-dialog-media-dialog"
      command="close"
      autofocus
    >
      Cancel
    </button>
    <button class="np-button" type="button">Share</button>
  </div>
</dialog>
