<div
  class="np-radio-group"
  role="radiogroup"
  aria-label="Plan"
  style="width: 100%; max-width: 24rem"
>
  <label class="np-field-label" for="card-plus">
    <span class="np-field np-field-horizontal">
      <span class="np-field-content">
        <span class="np-field-title">Plus</span>
        <span class="np-field-description"
          >For individuals and small teams.</span
        >
      </span>
      <input
        class="np-radio-group-item"
        type="radio"
        name="card-plan"
        id="card-plus"
        value="plus"
        checked
      />
    </span>
  </label>

  <label class="np-field-label" for="card-pro">
    <span class="np-field np-field-horizontal">
      <span class="np-field-content">
        <span class="np-field-title">Pro</span>
        <span class="np-field-description">For growing businesses.</span>
      </span>
      <input
        class="np-radio-group-item"
        type="radio"
        name="card-plan"
        id="card-pro"
        value="pro"
      />
    </span>
  </label>

  <label class="np-field-label" for="card-enterprise">
    <span class="np-field np-field-horizontal">
      <span class="np-field-content">
        <span class="np-field-title">Enterprise</span>
        <span class="np-field-description"
          >For large teams and organizations.</span
        >
      </span>
      <input
        class="np-radio-group-item"
        type="radio"
        name="card-plan"
        id="card-enterprise"
        value="enterprise"
      />
    </span>
  </label>
</div>
