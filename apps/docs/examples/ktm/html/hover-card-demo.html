<link rel="stylesheet" href="./styles/button.css" />
<link rel="stylesheet" href="./styles/avatar.css" />

<div class="np-hover-card">
  <a class="np-hover-card-trigger np-button np-button-link" href="#">@nextjs</a>
  <div class="np-hover-card-content" style="width: 20rem">
    <div style="display: flex; justify-content: space-between; gap: 1rem">
      <span class="np-avatar"
        ><img
          class="np-avatar-image"
          src="https://github.com/vercel.png"
          alt="@nextjs"
          onerror="this.hidden = true"
        /><span class="np-avatar-fallback">VC</span></span
      >
      <div style="display: grid; gap: 0.25rem">
        <h4 style="margin: 0; font-size: 0.875rem; font-weight: 600">
          @nextjs
        </h4>
        <p style="margin: 0; font-size: 0.875rem">
          The React Framework – created and maintained by @vercel.
        </p>
        <div style="font-size: 0.75rem; color: var(--np-muted-foreground)">
          Joined December 2021
        </div>
      </div>
    </div>
  </div>
</div>
