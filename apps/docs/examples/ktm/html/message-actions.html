<div
  style="
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 28rem;
  "
>
  <div class="np-message">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/pratapchaulagain.png"
          alt="@pratapchaulagain"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">PC</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-bubble np-bubble-secondary">
        <div class="np-bubble-content">
          The install failure is coming from the workspace package.
        </div>
      </div>
      <div class="np-message-footer">
        <button
          type="button"
          class="np-button np-button-ghost np-button-icon-xs"
          aria-label="Copy"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
          </svg>
        </button>
        <button
          type="button"
          class="np-button np-button-ghost np-button-icon-xs"
          aria-label="Retry"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </button>
        <button
          type="button"
          class="np-button np-button-ghost np-button-icon-xs"
          aria-label="Good response"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 10v12" />
            <path
              d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div class="np-message np-message-end">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/akkaldhami.png"
          alt="@akkaldhami"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">AD</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-bubble">
        <div class="np-bubble-content">
          Okay drop me a link. Taking a look...
        </div>
      </div>
      <div class="np-message-footer" style="color: var(--np-destructive)">
        Failed to send
      </div>
    </div>
  </div>
</div>
