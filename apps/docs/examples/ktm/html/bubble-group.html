<div style="width: 100%; max-width: 28rem; display: grid; gap: 1.5rem">
  <div class="np-bubble np-bubble-muted">
    <div class="np-bubble-content">Can you tell me what's the issue?</div>
  </div>
  <div class="np-bubble-group">
    <div class="np-bubble np-bubble-end">
      <div class="np-bubble-content">You tell me!</div>
    </div>
    <div class="np-bubble np-bubble-end">
      <div class="np-bubble-content">It worked yesterday. You broke it!</div>
    </div>
    <div class="np-bubble np-bubble-end">
      <div class="np-bubble-content">Find the bug and fix it.</div>
      <div
        class="np-bubble-reactions np-bubble-reactions-start"
        aria-label="Reactions: eyes"
      >
        <span>👀</span>
      </div>
    </div>
  </div>
  <div class="np-bubble np-bubble-muted">
    <div class="np-bubble-content">
      Want me to diff yesterday's you against today's you? It's a bit
      embarrassing.
    </div>
  </div>
</div>
