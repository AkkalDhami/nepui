<div style="width: 100%; max-width: 28rem; display: grid; gap: 1.5rem">
  <div class="np-bubble np-bubble-secondary">
    <div class="np-bubble-content">Bottom, end (the default).</div>
    <div
      class="np-bubble-reactions"
      role="img"
      aria-label="Reactions: thumbs up and fire"
    >
      <span>👍</span>
      <span>🔥</span>
    </div>
  </div>
  <div class="np-bubble np-bubble-secondary">
    <div class="np-bubble-content">Bottom, start.</div>
    <div
      class="np-bubble-reactions np-bubble-reactions-start"
      role="img"
      aria-label="Reaction: heart"
    >
      <span>❤️</span>
    </div>
  </div>
  <div class="np-bubble np-bubble-end">
    <div class="np-bubble-content">Top, end, with a count.</div>
    <div
      class="np-bubble-reactions np-bubble-reactions-top"
      role="img"
      aria-label="Reactions: thumbs up, fire, and 8 more"
    >
      <span>👍</span>
      <span>🔥</span>
      <span>+8</span>
    </div>
  </div>
</div>
