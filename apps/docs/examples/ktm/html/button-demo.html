<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/button.css" />
  </head>

  <body>
    <button class="np-button" data-variant="default">Default</button>

    <button class="np-button" data-variant="outline">Outline</button>

    <button class="np-button" data-variant="secondary">Secondary</button>

    <button class="np-button" data-variant="ghost">Ghost</button>

    <a
      class="np-button"
      href="https://github.com/akkaldhami/nepui"
      target="_blank"
      data-variant="link"
    >
      Link
    </a>

    <button
      class="np-button np-button-rounded"
      data-variant="outline"
      data-size="icon"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M12 19V5m0 0-6 6m6-6 6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <button class="np-button" data-variant="destructive">Destructive</button>
  </body>
</html>
