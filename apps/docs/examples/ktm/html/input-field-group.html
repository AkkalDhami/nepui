<div style="width: 100%; max-width: 24rem" class="np-field-group">
  <div class="np-field">
    <label class="np-field-label" for="name">Name</label>
    <input id="name" class="np-input" placeholder="Lakka Imahd" />
  </div>

  <div class="np-field">
    <label class="np-field-label" for="email">Email</label>
    <input
      id="email"
      class="np-input"
      type="email"
      placeholder="name@example.com"
    />
    <p class="np-field-description">We'll send updates to this address.</p>
  </div>

  <div class="np-field" data-orientation="horizontal">
    <button type="reset" class="np-button" data-variant="outline">Reset</button>
    <button type="submit" class="np-button">Submit</button>
  </div>
</div>
