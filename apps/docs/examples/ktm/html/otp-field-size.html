<link rel="stylesheet" href="./styles/label.css" />

<div style="display: grid; gap: 1.5rem; width: fit-content">
  <div style="display: grid; gap: 0.5rem; width: fit-content">
    <label class="np-label" id="otp-size-sm-label" for="otp-size-sm"
      >Small</label
    >
    <div
      class="np-otp-field np-otp-field-sm"
      role="group"
      aria-labelledby="otp-size-sm-label"
    >
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="one-time-code"
        id="otp-size-sm"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 2 of 4"
