<link rel="stylesheet" href="./styles/button.css" />

<div
  style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem"
>
  <div
    class="np-hover-card np-hover-card-left"
    style="--np-hover-card-delay: 100ms; --np-hover-card-close-delay: 100ms"
  >
    <a class="np-hover-card-trigger np-button np-button-outline" href="#"
      >Left</a
    >
    <div class="np-hover-card-content" style="max-width: 13rem">
      The hover card appears on the left side of the trigger.
    </div>
  </div>
  <div
    class="np-hover-card np-hover-card-top"
    style="--np-hover-card-delay: 100ms; --np-hover-card-close-delay: 100ms"
  >
    <a class="np-hover-card-trigger np-button np-button-outline" href="#"
      >Top</a
    >
    <div class="np-hover-card-content">
      <p style="margin: 0">
        The hover card appears on the top side of the trigger.
      </p>
    </div>
  </div>
  <div
    class="np-hover-card np-hover-card-bottom"
    style="--np-hover-card-delay: 100ms; --np-hover-card-close-delay: 100ms"
  >
    <a class="np-hover-card-trigger np-button np-button-outline" href="#"
      >Bottom</a
    >
    <div class="np-hover-card-content">
      <p style="margin: 0">
        The hover card appears on the bottom side of the trigger.
      </p>
    </div>
  </div>
  <div
    class="np-hover-card np-hover-card-right"
    style="--np-hover-card-delay: 100ms; --np-hover-card-close-delay: 100ms"
  >
    <a class="np-hover-card-trigger np-button np-button-outline" href="#"
      >Right</a
    >
    <div class="np-hover-card-content" style="max-width: 13rem">
      The hover card appears on the right side of the trigger.
    </div>
  </div>
</div>
