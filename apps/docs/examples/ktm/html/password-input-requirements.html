<link rel="stylesheet" href="./styles/field.css" />

<div style="width: 100%; max-width: 24rem">
  <div class="np-field">
    <label class="np-field-label" for="password-input-requirements"
      >Create a password</label
    >
    <div class="np-password-input">
      <input
        class="np-password-input-control"
        id="password-input-requirements"
        type="password"
        autocomplete="new-password"
        spellcheck="false"
        autocapitalize="off"
      />
      <button
        class="np-password-input-toggle"
        type="button"
        aria-label="Show password"
        aria-pressed="false"
      >
        <svg
          class="np-password-input-icon-show"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <svg
          class="np-password-input-icon-hide"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
          />
          <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
          <path
            d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
          />
          <path d="m2 2 20 20" />
        </svg>
      </button>
    </div>
    <ul
      class="np-password-input-requirements"
      aria-label="Password requirements"
    >
      <li class="np-password-input-requirement" data-rule="length">
        <svg
          class="np-password-input-requirement-icon np-password-input-requirement-check"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <svg
          class="np-password-input-requirement-icon np-password-input-requirement-x"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
        <span
          class="np-password-input-requirement-status np-password-input-requirement-done"
          >Done:</span
        >
        <span
          class="np-password-input-requirement-status np-password-input-requirement-todo"
          >To do:</span
        >
        At least 8 characters
      </li>
      <li class="np-password-input-requirement" data-rule="number">
        <svg
          class="np-password-input-requirement-icon np-password-input-requirement-check"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <svg
          class="np-password-input-requirement-icon np-password-input-requirement-x"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
        <span
          class="np-password-input-requirement-status np-password-input-requirement-done"
          >Done:</span
        >
        <span
          class="np-password-input-requirement-status np-password-input-requirement-todo"
          >To do:</span
        >
        A number
      </li>
      <li class="np-password-input-requirement" data-rule="case">
        <svg
          class="np-password-input-requirement-icon np-password-input-requirement-check"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <svg
          class="np-password-input-requirement-icon np-password-input-requirement-x"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
        <span
          class="np-password-input-requirement-status np-password-input-requirement-done"
          >Done:</span
        >
        <span
          class="np-password-input-requirement-status np-password-input-requirement-todo"
          >To do:</span
        >
        An uppercase and a lowercase letter
      </li>
    </ul>
  </div>
</div>
