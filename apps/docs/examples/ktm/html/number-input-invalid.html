<div
  style="
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    width: 100%;
    max-width: 16rem;
  "
>
  <div class="np-number-input" style="width: 100%; max-width: 10rem">
    <div class="np-number-input-group">
      <button
        type="button"
        class="np-number-input-decrement"
        aria-label="Decrease"
        tabindex="-1"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14" />
        </svg>
      </button>
      <input
        class="np-number-input-input"
        type="number"
        value="150"
        aria-label="Quantity"
        aria-describedby="number-input-invalid-message"
        aria-invalid="true"
      />
      <button
        type="button"
        class="np-number-input-increment"
        aria-label="Increase"
        tabindex="-1"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14M12 5v14" />
        </svg>
      </button>
    </div>
  </div>
  <p
    id="number-input-invalid-message"
    style="margin: 0; font-size: 0.875rem; color: var(--np-destructive)"
  >
    Maximum quantity is 100.
  </p>
</div>
