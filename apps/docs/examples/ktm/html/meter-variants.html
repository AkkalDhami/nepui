<div
  style="
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    width: 100%;
    max-width: 20rem;
  "
>
  <div class="np-meter">
    <label class="np-meter-label" for="meter-var-default">Default</label>
    <span class="np-meter-value">30%</span>
    <meter
      class="np-meter-track"
      id="meter-var-default"
      value="30"
      min="0"
      max="100"
    >
      30%
    </meter>
  </div>

  <div class="np-meter np-meter-success">
    <label class="np-meter-label" for="meter-var-success">Success</label>
    <span class="np-meter-value">45%</span>
    <meter
      class="np-meter-track"
      id="meter-var-success"
      value="45"
      min="0"
      max="100"
    >
      45%
    </meter>
  </div>

  <div class="np-meter np-meter-warning">
    <label class="np-meter-label" for="meter-var-warning">Warning</label>
    <span class="np-meter-value">70%</span>
    <meter
      class="np-meter-track"
      id="meter-var-warning"
      value="70"
      min="0"
      max="100"
    >
      70%
    </meter>
  </div>

  <div class="np-meter np-meter-destructive">
    <label class="np-meter-label" for="meter-var-destructive"
      >Destructive</label
    >
    <span class="np-meter-value">92%</span>
    <meter
      class="np-meter-track"
      id="meter-var-destructive"
      value="92"
      min="0"
      max="100"
    >
      92%
    </meter>
  </div>
</div>
