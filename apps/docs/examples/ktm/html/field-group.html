<div style="width: 100%; max-width: 24rem">
  <div class="np-field-group">
    <fieldset class="np-field-set">
      <legend class="np-field-legend np-field-legend-label">Responses</legend>
      <p class="np-field-description">
        Get notified when ChatGPT responds to requests that take time, like
        research or image generation.
      </p>
      <div class="np-field-group" style="gap: 0.75rem">
        <div class="np-field np-field-horizontal" role="group">
          <input
            id="push-responses"
            type="checkbox"
            class="np-checkbox"
            checked
            disabled
          />
          <label
            class="np-field-label"
            for="push-responses"
            style="font-weight: 400"
            >Push notifications</label
          >
        </div>
      </div>
    </fieldset>

    <div class="np-field-separator">
      <div class="np-separator" role="separator"></div>
    </div>

    <fieldset class="np-field-set">
      <legend class="np-field-legend np-field-legend-label">Tasks</legend>
      <p class="np-field-description">
        Get notified when tasks you've created have updates.
        <a href="#">Manage tasks</a>
      </p>
      <div class="np-field-group" style="gap: 0.75rem">
        <div class="np-field np-field-horizontal" role="group">
          <input id="push-tasks" type="checkbox" class="np-checkbox" />
          <label
            class="np-field-label"
            for="push-tasks"
            style="font-weight: 400"
            >Push notifications</label
          >
        </div>
        <div class="np-field np-field-horizontal" role="group">
          <input id="email-tasks" type="checkbox" class="np-checkbox" />
          <label
            class="np-field-label"
            for="email-tasks"
            style="font-weight: 400"
            >Email notifications</label
          >
        </div>
      </div>
    </fieldset>
  </div>
</div>
