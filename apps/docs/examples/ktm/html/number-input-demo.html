<div class="np-number-input" style="width: 100%; max-width: 10rem">

      class="np-number-input-decrement"
      aria-label="Decrease"
      tabindex="-1"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"

      >
        <path d="M5 12h14" />

      class="np-number-input-increment"

        fill="none"
        stroke="currentColor"

        stroke-linecap="round"
