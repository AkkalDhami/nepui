<link rel="stylesheet" href="./styles/toggle.css" />
<script src="./javascripts/toggle.js" defer></script>

<div style="display: flex; align-items: center; gap: 0.5rem">
  <button
    type="button"
    class="np-toggle np-toggle-outline np-toggle-sm"
    aria-pressed="false"
    aria-label="Toggle small"
  >
    Small
  </button>

  <button
    type="button"
    class="np-toggle np-toggle-outline"
    aria-pressed="false"
    aria-label="Toggle default"
  >
    Default
  </button>

  <button
    type="button"
    class="np-toggle np-toggle-outline np-toggle-lg"
    aria-pressed="false"
    aria-label="Toggle large"
  >
    Large
  </button>
</div>
