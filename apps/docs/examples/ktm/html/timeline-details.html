<link rel="stylesheet" href="./styles/button.css" />
<link rel="stylesheet" href="./styles/collapsible.css" />
<link rel="stylesheet" href="./styles/list.css" />

<div
  class="np-timeline"
  aria-label="Changelog"
  style="width: 100%; max-width: 24rem"
>
  <div class="np-timeline-item">
    <span class="np-timeline-marker"></span>
    <span class="np-timeline-connector"></span>
    <div class="np-timeline-title">v2.4.0</div>
    <time class="np-timeline-time">Nov 14</time>
    <details class="np-collapsible">
      <summary
        class="np-collapsible-trigger np-button np-button-ghost np-button-sm"
        style="list-style: none; cursor: pointer"
      >
        What changed
      </summary>
      <ul class="np-collapsible-content np-list">
        <li>Export reports as CSV</li>
        <li>Faster search</li>
        <li>Fixed the date picker in RTL</li>
      </ul>
    </details>
  </div>
  <div class="np-timeline-item">
    <span class="np-timeline-marker"></span>
    <span class="np-timeline-connector"></span>
    <div class="np-timeline-title">v2.3.0</div>
    <time class="np-timeline-time">Oct 29</time>
    <details class="np-collapsible">
      <summary
        class="np-collapsible-trigger np-button np-button-ghost np-button-sm"
        style="list-style: none; cursor: pointer"
      >
        What changed
      </summary>
      <ul
        style="
          margin: 0.25rem 0 0;
          padding-inline-start: 1.25rem;
          color: var(--np-muted-foreground);
          font-size: 0.875rem;
        "
        class="np-collapsible-content np-list"
      >
        <li>New onboarding flow</li>
        <li>Dark mode for charts</li>
      </ul>
    </details>
  </div>
  <div class="np-timeline-item">
    <span class="np-timeline-marker"></span>
    <span class="np-timeline-connector"></span>
    <div class="np-timeline-title">v2.2.0</div>
    <time class="np-timeline-time">Oct 02</time>
    <details class="np-collapsible">
      <summary
        class="np-collapsible-trigger np-button np-button-ghost np-button-sm"
        style="list-style: none; cursor: pointer"
      >
        What changed
      </summary>
      <ul
        style="
          margin: 0.25rem 0 0;
          padding-inline-start: 1.25rem;
          color: var(--np-muted-foreground);
          font-size: 0.875rem;
        "
        class="np-collapsible-content np-list"
      >
        <li>Keyboard shortcuts</li>
        <li>Smaller bundle</li>
      </ul>
    </details>
  </div>
</div>
