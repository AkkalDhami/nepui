<div class="np-tabs" style="width: 100%; max-width: 24rem">
  <div class="np-tabs-list" role="tablist" aria-label="Settings">
    <button
      type="button"
      class="np-tabs-trigger"
      role="tab"
      id="tabs-demo-account"
      aria-selected="true"
      aria-controls="tabs-demo-account-panel"
    >
      Account
    </button>
    <button
      type="button"
      class="np-tabs-trigger"
      role="tab"
      id="tabs-demo-password"
      aria-selected="false"
      aria-controls="tabs-demo-password-panel"
      tabindex="-1"
    >
      Password
    </button>
  </div>
  <div
    class="np-tabs-content"
    role="tabpanel"
    id="tabs-demo-account-panel"
    aria-labelledby="tabs-demo-account"
    tabindex="0"
  >
    Make changes to your account here.
  </div>
  <div
    class="np-tabs-content"
    role="tabpanel"
    id="tabs-demo-password-panel"
    aria-labelledby="tabs-demo-password"
    tabindex="0"
    hidden
  >
    Change your password here.
  </div>
</div>
