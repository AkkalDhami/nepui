<link rel="stylesheet" href="./styles/bubble.css" />
<link rel="stylesheet" href="./styles/avatar.css" />
<link rel="stylesheet" href="./styles/marker.css" />

<div
  style="
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 28rem;
  "
>
  <div class="np-message np-message-end">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/akkaldhami.png"
          alt="@akkaldhami"
          onerror="this.hidden = true"
        /><span class="np-avatar-fallback">AD</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-bubble">
        <div class="np-bubble-content">Deploying to prod real quick.</div>
      </div>
    </div>
  </div>
  <div class="np-message">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/pratapchaulagain.png"
          alt="@pratapchaulagain"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">PC</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-bubble np-bubble-muted">
        <div class="np-bubble-content">It's 4:55 PM. On a Friday.</div>
      </div>
    </div>
  </div>
  <div class="np-message np-message-end">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/akkaldhami.png"
          alt="@akkaldhami"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">AD</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-bubble">
        <div class="np-bubble-content">It's a one-line change.</div>
      </div>
      <div class="np-message-footer">Delivered</div>
    </div>
  </div>
  <div class="np-message">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/pratapchaulagain.png"
          alt="@pratapchaulagain"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">PC</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-bubble-group">
        <div class="np-bubble np-bubble-muted">
          <div class="np-bubble-content">It's always a one-line change 😭.</div>
        </div>
        <div class="np-bubble np-bubble-muted">
          <div class="np-bubble-content">Alright, let me take a look.</div>
          <div class="np-bubble-reactions" aria-label="Reactions: thumbs up">
            <span>👍</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div role="status" class="np-marker">
    <div data-shimmer class="np-marker-content">
      <span style="font-weight: 500"> Pratap </span> is typing...
    </div>
  </div>
</div>
