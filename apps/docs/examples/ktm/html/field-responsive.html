<div style="width: 100%; max-width: 40rem">
  <form>
    <div class="np-field-group">
      <fieldset class="np-field-set">
        <legend class="np-field-legend">Profile</legend>
        <p class="np-field-description">Fill in your profile information.</p>
        <div class="np-field-group">
          <div class="np-field np-field-responsive" role="group">
            <div class="np-field-content">
              <label class="np-field-label" for="name">Name</label>
              <p class="np-field-description">
                Provide your full name for identification
              </p>
            </div>
            <input
              id="name"
              class="np-input"
              placeholder="Lakka Imahd"
              required
            />
          </div>

          <div class="np-field np-field-responsive" role="group">
            <button class="np-button" type="submit">Submit</button>
            <button class="np-button np-button-outline" type="button">
              Cancel
            </button>
          </div>
        </div>
      </fieldset>
    </div>
  </form>
</div>
