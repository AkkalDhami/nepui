<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/input.css" />
    <link rel="stylesheet" href="./styles/label.css" />
    <style>
      .row {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
        width: 340px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="email" class="np-label"
        >Enter your email
        <span style="color: var(--np-destructive)">*</span></label
      >
      <input
        id="email"
        type="email"
        class="np-input"
        placeholder="Enter your email"
      />
    </div>
  </body>
</html>
