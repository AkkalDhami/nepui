<link rel="stylesheet" href="./styles/button.css" />

<div class="np-group np-group-vertical" role="group" aria-label="Zoom">
  <button
    type="button"
    class="np-button np-button-outline np-button-icon"
    aria-label="Zoom in"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M5 12h14" />
      <path d="M12 5v14" />
    </svg>
  </button>
  <div
    class="np-group-separator np-group-separator-horizontal"
    role="separator"
    aria-orientation="horizontal"
  ></div>
  <button
    type="button"
    class="np-button np-button-outline np-button-icon"
    aria-label="Zoom out"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M5 12h14" />
    </svg>
  </button>
</div>
