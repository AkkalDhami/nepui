<button
  type="button"
  class="np-button np-button-outline"
  commandfor="dialog-demo"
  command="show-modal"
>
  Open Dialog
</button>

<dialog
  id="dialog-demo"
  class="np-dialog-content"
  closedby="any"
  aria-labelledby="dialog-demo-title"
  aria-describedby="dialog-demo-description"
>
  <div class="np-dialog-header">
    <h2 class="np-dialog-title" id="dialog-demo-title">
      Are you absolutely sure?
    </h2>
    <p class="np-dialog-description" id="dialog-demo-description">
      This action cannot be undone. This will permanently delete your account
      and remove your data from our servers.
    </p>
  </div>
  <button
    type="button"
    class="np-button np-button-ghost np-button-icon-sm np-dialog-close"
    commandfor="dialog-demo"
    command="close"
    aria-label="Close"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </svg>
  </button>
</dialog>
