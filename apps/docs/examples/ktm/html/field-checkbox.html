<div style="width: 100%; max-width: 24rem">
  <div class="np-field-group">
    <fieldset class="np-field-set">
      <legend class="np-field-legend np-field-legend-label">
        Show these items on the desktop
      </legend>
      <p class="np-field-description">
        Select the items you want to show on the desktop.
      </p>
      <div class="np-field-group" style="gap: 0.75rem">
        <div class="np-field np-field-horizontal" role="group">
          <input id="hard-disks" type="checkbox" class="np-checkbox" checked />
          <label
            class="np-field-label"
            for="hard-disks"
            style="font-weight: 400"
            >Hard disks</label
          >
        </div>
        <div class="np-field np-field-horizontal" role="group">
          <input id="external-disks" type="checkbox" class="np-checkbox" />
          <label
            class="np-field-label"
            for="external-disks"
            style="font-weight: 400"
            >External disks</label
          >
        </div>
        <div class="np-field np-field-horizontal" role="group">
          <input id="cds-dvds" type="checkbox" class="np-checkbox" />
          <label class="np-field-label" for="cds-dvds" style="font-weight: 400"
            >CDs, DVDs, and iPods</label
          >
        </div>
        <div class="np-field np-field-horizontal" role="group">
          <input id="connected-servers" type="checkbox" class="np-checkbox" />
          <label
            class="np-field-label"
            for="connected-servers"
            style="font-weight: 400"
            >Connected servers</label
          >
        </div>
      </div>
    </fieldset>

    <div class="np-field-separator">
      <div class="np-separator" role="separator"></div>
    </div>

    <div class="np-field np-field-horizontal" role="group">
      <input id="sync-folders" type="checkbox" class="np-checkbox" checked />
      <div class="np-field-content">
        <label class="np-field-label" for="sync-folders"
          >Sync Desktop &amp; Documents folders</label
        >
        <p class="np-field-description">
          Your Desktop &amp; Documents folders are being synced with iCloud
          Drive. You can access them from other devices.
        </p>
      </div>
    </div>
  </div>
</div>
