<div style="width: 100%; max-width: 24rem; display: grid; gap: 0.75rem">
  <div class="np-attachment np-attachment-idle">
    <div class="np-attachment-media">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" x2="12" y1="3" y2="15" />
      </svg>
    </div>
    <div class="np-attachment-content">
      <div class="np-attachment-title">invoice.pdf</div>
      <div class="np-attachment-description">Ready to upload</div>
    </div>
  </div>
  <div
    class="np-attachment np-attachment-uploading"
    style="--np-attachment-progress: 60%"
  >
    <div class="np-attachment-media">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
      </svg>
    </div>
    <div class="np-attachment-content">
      <div class="np-attachment-title">invoice.pdf</div>
      <div class="np-attachment-description">Uploading… 60%</div>
    </div>
    <div class="np-attachment-actions">
      <button
        type="button"
        class="np-button np-button-ghost np-button-icon-xs np-attachment-action"
        aria-label="Cancel upload of invoice.pdf"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
  </div>
  <div class="np-attachment np-attachment-processing">
    <div class="np-attachment-media">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
      </svg>
    </div>
    <div class="np-attachment-content">
      <div class="np-attachment-title">invoice.pdf</div>
      <div class="np-attachment-description">Processing…</div>
    </div>
  </div>
  <div class="np-attachment np-attachment-error">
    <div class="np-attachment-media">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10" />
        <line x1="12" x2="12" y1="8" y2="12" />
        <line x1="12" x2="12.01" y1="16" y2="16" />
      </svg>
    </div>
    <div class="np-attachment-content">
      <div class="np-attachment-title">invoice.pdf</div>
      <div class="np-attachment-description">
        Upload failed: the file is too large
      </div>
    </div>
    <div class="np-attachment-actions">
      <button
        type="button"
        class="np-button np-button-ghost np-button-icon-xs np-attachment-action"
        aria-label="Retry upload of invoice.pdf"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg></button
      ><button
        type="button"
        class="np-button np-button-ghost np-button-icon-xs np-attachment-action"
        aria-label="Remove invoice.pdf"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
  </div>
  <div class="np-attachment">
    <div class="np-attachment-media">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
      </svg>
    </div>
    <div class="np-attachment-content">
      <div class="np-attachment-title">invoice.pdf</div>
      <div class="np-attachment-description">PDF · 1.2 MB</div>
    </div>
    <div class="np-attachment-actions">
      <button
        type="button"
        class="np-button np-button-ghost np-button-icon-xs np-attachment-action"
        aria-label="Remove invoice.pdf"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
