<link rel="stylesheet" href="./styles/bubble.css" />
<link rel="stylesheet" href="./styles/avatar.css" />
<link rel="stylesheet" href="./styles/attachment.css" />

<div
  style="
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 28rem;
  "
>
  <div class="np-message np-message-end">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/akkaldhami.png"
          alt="@akkaldhami"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">AD</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-attachment np-attachment-vertical" style="width: 12rem">
        <div class="np-attachment-media np-attachment-media-image">
          <img
            src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=900&auto=format&fit=crop&q=80"
            alt="Workspace"
          />
        </div>
      </div>
      <div class="np-bubble">
        <div class="np-bubble-content">
          Here's the image. Can you add it to the PDF? Use it for the cover
          page.
        </div>
      </div>
    </div>
  </div>
  <div class="np-message">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/manisbhusal.png"
          alt="@manisbhusal"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">MB</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-bubble np-bubble-secondary">
        <div class="np-bubble-content">
          Done. Here's the PDF with the image added as the cover page.
        </div>
      </div>
      <div class="np-attachment">
        <div class="np-attachment-media">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"
            />
            <path d="M14 2v4a2 2 0 0 0 2 2h4" />
            <path d="M10 9H8" />
            <path d="M16 13H8" />
            <path d="M16 17H8" />
          </svg>
        </div>
        <div class="np-attachment-content">
          <div class="np-attachment-title">sales-dashboard.pdf</div>
          <div class="np-attachment-description">PDF · 2.4 MB</div>
        </div>
      </div>
    </div>
  </div>
</div>
