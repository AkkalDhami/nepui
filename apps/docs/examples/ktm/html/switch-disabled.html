<div style="display: flex; flex-direction: column; gap: 0.75rem">
  <div
    class="np-field np-field-horizontal"
    data-disabled
    style="width: fit-content"
  >
    <input
      class="np-switch"
      type="checkbox"
      role="switch"
      id="sw-dis-off"
      disabled
    />
    <label class="np-field-label" for="sw-dis-off">Disabled</label>
  </div>
  <div
    class="np-field np-field-horizontal"
    data-disabled
    style="width: fit-content"
  >
    <input
      class="np-switch"
      type="checkbox"
      role="switch"
      id="sw-dis-on"
      disabled
      checked
    />
    <label class="np-field-label" for="sw-dis-on">Disabled and on</label>
  </div>
</div>
