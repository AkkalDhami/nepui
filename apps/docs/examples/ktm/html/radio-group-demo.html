<div
  class="np-radio-group"
  role="radiogroup"
  aria-label="Density"
  style="width: fit-content"
>
  <div style="display: flex; align-items: center; gap: 0.75rem">
    <input
      class="np-radio-group-item"
      type="radio"
      name="demo-density"
      id="demo-r1"
      value="default"
    />
    <label class="np-label" for="demo-r1">Default</label>
  </div>

  <div style="display: flex; align-items: center; gap: 0.75rem">
    <input
      class="np-radio-group-item"
      type="radio"
      name="demo-density"
      id="demo-r2"
      value="comfortable"
      checked
    />
    <label class="np-label" for="demo-r2">Comfortable</label>
  </div>

  <div style="display: flex; align-items: center; gap: 0.75rem">
    <input
      class="np-radio-group-item"
      type="radio"
      name="demo-density"
      id="demo-r3"
      value="compact"
    />
    <label class="np-label" for="demo-r3">Compact</label>
  </div>
</div>
