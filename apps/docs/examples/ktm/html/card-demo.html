<link rel="stylesheet" href="./styles/tokens.css" />
<link rel="stylesheet" href="./styles/button.css" />
<link rel="stylesheet" href="./styles/input.css" />
<link rel="stylesheet" href="./styles/label.css" />
<link rel="stylesheet" href="./styles/badge.css" />
<link rel="stylesheet" href="./styles/card.css" />

<div class="np-card" style="max-width: 24rem; width: 100%">
  <div class="np-card-header">
    <div class="np-card-title">Login to your account</div>
    <div class="np-card-description">
      Enter your email below to login to your account
    </div>
    <div class="np-card-action">
      <button type="button" class="np-button np-button-link">Sign Up</button>
    </div>
  </div>
  <div class="np-card-content">
    <form style="display: flex; flex-direction: column; gap: 1.5rem">
      <div style="display: flex; flex-direction: column; gap: 0.5rem">
        <label class="np-label" for="idx-email">Email</label>
        <input
          class="np-input"
          id="idx-email"
          type="email"
          placeholder="m@example.com"
        />
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.5rem">
        <label class="np-label" for="idx-password">Password</label>
        <input
          class="np-input"
          id="idx-password"
          type="password"
          placeholder=""
        />
      </div>
    </form>
  </div>
  <div
    class="np-card-footer"
    style="display: flex; gap: 0.5rem; flex-direction: column"
  >
    <button type="button" class="np-button" style="width: 100%">Login</button>
    <button
      type="button"
      class="np-button np-button-outline"
      style="width: 100%"
    >
      Login with Google
    </button>
  </div>
</div>
