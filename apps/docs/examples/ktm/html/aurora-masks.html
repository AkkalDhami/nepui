<div
  style="
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
    gap: 0.75rem;
  "
>
  <div
    class="np-aurora"
    data-gradient="candy"
    data-mask="corner"
    style="
      display: grid;
      place-items: center;
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">corner</strong>
    <span style="color: var(--np-muted-foreground); font-size: 0.8125rem"
      >From the corner</span
    >
  </div>
  <div
    class="np-aurora"
    data-gradient="candy"
    data-mask="center"
    style="
      display: grid;
      max-width: 32rem;
      place-items: center;
      grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">center</strong>
    <span style="color: var(--np-muted-foreground); font-size: 0.8125rem"
      >Centered glow</span
    >
  </div>
  <div
    class="np-aurora"
    data-gradient="candy"
    data-mask="top"
    style="
      display: grid;
      place-items: center;
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">top</strong>
    <span style="color: var(--np-muted-foreground); font-size: 0.8125rem"
      >Fades downward</span
    >
  </div>
  <div
    class="np-aurora"
    data-gradient="candy"
    data-mask="bottom"
    style="
      display: grid;
      place-items: center;
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">bottom</strong>
    <span style="color: var(--np-muted-foreground); font-size: 0.8125rem"
      >Rises from below</span
    >
  </div>
  <div
    class="np-aurora"
    data-gradient="candy"
    data-mask="none"
    style="
      display: grid;
      place-items: center;
      gap: 0.25rem;
      padding: 2.5rem 1rem;
      text-align: center;
      border: 1px solid var(--np-border);
      border-radius: var(--np-radius-lg);
    "
  >
    <strong style="font-size: 1.125rem">none</strong>
    <span style="color: var(--np-muted-foreground); font-size: 0.8125rem"
      >Fills the box</span
    >
  </div>
