<div style="display: grid; gap: 0.75rem; width: 100%; max-width: 20rem">
  <div
    style="display: flex; align-items: center; justify-content: space-between"
  >
    <label class="np-label" id="slider-temperature-label">Temperature</label>
    <output
      id="slider-temperature-output"
      style="font-size: 0.875rem; color: var(--np-muted-foreground)"
    >
      0.3, 0.7
    </output>
  </div>

  <div
    class="np-slider-group"
    role="group"
    aria-labelledby="slider-temperature-label"
    data-slider-group
    data-output="slider-temperature-output"
  >
    <input
      class="np-slider"
      type="range"
      min="0"
      max="1"
      step="0.1"
      value="0.3"
      aria-label="Temperature minimum"
    />
    <input
      class="np-slider"
      type="range"
      min="0"
      max="1"
      step="0.1"
      value="0.7"
      aria-label="Temperature maximum"
    />
  </div>
</div>

<script src="./javascripts/slider.js" defer></script>

<script>
  document.querySelectorAll("[data-slider-group]").forEach((group) => {
    const outputId = group.dataset.output
    const output = document.getElementById(outputId)
    const sliders = group.querySelectorAll('input[type="range"]')

    if (!output || !sliders.length) return

    const updateOutput = () => {
      output.textContent = Array.from(sliders)
        .map((slider) => slider.value)
        .join(", ")
    }

    sliders.forEach((slider) => {
      slider.addEventListener("input", updateOutput)
    })

    updateOutput()
  })
</script>
