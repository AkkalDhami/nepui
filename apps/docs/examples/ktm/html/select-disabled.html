<div
  style="
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.75rem;
  "
>
  <div class="np-select-wrapper">
    <select
      class="np-select"
      aria-label="Disabled select"
      style="width: 12rem"
      disabled
    >
      <option value="" selected disabled hidden>Disabled</option>
      <option value="apple">Apple</option>
      <option value="banana">Banana</option>
      <option value="blueberry">Blueberry</option>
    </select>
  </div>
  <div class="np-select-wrapper">
    <select
      class="np-select"
      aria-label="Select with a disabled option"
      style="width: 12rem"
    >
      <option value="" selected disabled hidden>Disabled item</option>
      <option value="apple">Apple</option>
      <option value="banana" disabled>Banana</option>
      <option value="blueberry">Blueberry</option>
    </select>
  </div>
</div>
