<div class="np-number-input" style="width: 100%; max-width: 10rem">
  <span class="np-number-input-scrub-area"
    ><label class="np-label" for="number-input-scrub">Quantity</label></span
  >
  <div class="np-number-input-group">
    <button
      type="button"
      class="np-number-input-decrement"
      aria-label="Decrease"
      tabindex="-1"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12h14" />
      </svg>
    </button>
    <input
      class="np-number-input-input"
      type="number"
      id="number-input-scrub"
      value="0"
    />
    <button
      type="button"
      class="np-number-input-increment"
      aria-label="Increase"
      tabindex="-1"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12h14M12 5v14" />
      </svg>
    </button>
  </div>
</div>
