<div class="np-menu" style="--np-menu-anchor: --menu-submenu">
  <button
    class="np-button np-button-outline"
    type="button"
    popovertarget="menu-submenu"
  >
    Open
  </button>

  <div
    id="menu-submenu"
    class="np-menu-content"
    popover
    role="menu"
    aria-label="Team"
    style="width: 12rem"
  >
    <div class="np-menu-group" role="group">
      <button class="np-menu-item" type="button" role="menuitem">Team</button>

      <div class="np-menu-sub" style="--np-menu-anchor: --menu-submenu-invite">
        <button
          class="np-menu-item np-menu-sub-trigger"
          type="button"
          role="menuitem"
          aria-haspopup="menu"
          popovertarget="menu-submenu-invite"
        >
          Invite users
          <svg
            class="np-menu-sub-chevron"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>

        <div
          id="menu-submenu-invite"
          class="np-menu-content np-menu-sub-content"
          popover
          role="menu"
          aria-label="Invite users"
        >
          <div class="np-menu-group" role="group">
            <button class="np-menu-item" type="button" role="menuitem">
              Email
            </button>
            <button class="np-menu-item" type="button" role="menuitem">
              Message
            </button>
            <button class="np-menu-item" type="button" role="menuitem">
              More...
            </button>
          </div>
        </div>
      </div>

      <button class="np-menu-item" type="button" role="menuitem">
        New Team
      </button>
    </div>
  </div>
</div>
