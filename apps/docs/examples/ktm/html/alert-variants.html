<div
  style="
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 28rem;
  "
>
  <div class="np-alert" role="alert">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <polyline points="4 17 10 11 4 5" />
      <line x1="12" x2="20" y1="19" y2="19" />
    </svg>
    <div class="np-alert-title">Heads up!</div>
    <div class="np-alert-description">
      You can add components using the CLI.
    </div>
  </div>

  <div class="np-alert np-alert-success" role="alert">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <path d="m9 12 2 2 4-4" />
    </svg>
    <div class="np-alert-title">Payment successful</div>
    <div class="np-alert-description">Your payment has been processed.</div>
  </div>

  <div class="np-alert np-alert-info" role="alert">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    </svg>
    <div class="np-alert-title">New feature available</div>
    <div class="np-alert-description">Dark mode is now in your settings.</div>
  </div>

  <div class="np-alert np-alert-warning" role="alert">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
      />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    </svg>
    <div class="np-alert-title">Subscription expiring</div>
    <div class="np-alert-description">Your plan ends in 3 days.</div>
  </div>

  <div class="np-alert np-alert-error" role="alert">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <path d="M12 8v4" />
      <path d="M12 16h.01" />
    </svg>
    <div class="np-alert-title">Payment failed</div>
    <div class="np-alert-description">Please check your payment method.</div>
  </div>
</div>
