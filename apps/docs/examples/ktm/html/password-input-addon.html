<link rel="stylesheet" href="./styles/field.css" />

<div style="width: 100%; max-width: 24rem">
  <div class="np-field">
    <div
      style="display: flex; align-items: center; justify-content: space-between"
    >
      <label class="np-field-label" for="password-input-addon">Password</label>
      <a
        href="#forgot-password"
        style="
          font-size: 0.875rem;
          color: var(--np-muted-foreground);
          text-decoration: underline;
          text-underline-offset: 4px;
        "
        >Forgot password?</a
      >
    </div>
    <div class="np-password-input">
      <span class="np-password-input-addon"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"
          />
          <path d="m21 2-9.6 9.6" />
          <circle cx="7.5" cy="15.5" r="5.5" /></svg
      ></span>
      <input
        class="np-password-input-control"
        id="password-input-addon"
        type="password"
        autocomplete="current-password"
        spellcheck="false"
        autocapitalize="off"
        placeholder="Enter your password"
      />
      <button
        class="np-password-input-toggle"
        type="button"
        aria-label="Show password"
        aria-pressed="false"
      >
        <svg
          class="np-password-input-icon-show"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <svg
          class="np-password-input-icon-hide"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
          />
          <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
          <path
            d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
          />
          <path d="m2 2 20 20" />
        </svg>
      </button>
    </div>
  </div>
</div>
