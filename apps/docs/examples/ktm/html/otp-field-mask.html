<link rel="stylesheet" href="./styles/field.css" />

<div style="display: grid; place-items: center">
  <div class="np-field">
    <label class="np-field-label" id="otp-mask-label" for="otp-mask"
      >Access code</label
    >
    <div class="np-otp-field" role="group" aria-labelledby="otp-mask-label">
      <input
        class="np-otp-field-input"
        type="password"
        inputmode="numeric"
        maxlength="1"
        autocomplete="one-time-code"
        id="otp-mask"
      />
      <input
        class="np-otp-field-input"
        type="password"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 2 of 6"
      />
      <input
        class="np-otp-field-input"
        type="password"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 3 of 6"
      />
      <input
        class="np-otp-field-input"
        type="password"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 4 of 6"
      />
      <input
        class="np-otp-field-input"
        type="password"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 5 of 6"
      />
      <input
        class="np-otp-field-input"
        type="password"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 6 of 6"
      />
    </div>
    <p class="np-field-description">
      Use <code>type="password"</code> on the slots to obscure the code on
      shared screens.
    </p>
  </div>
</div>
