<div style="width: 100%; max-width: 24rem">
  <fieldset class="np-field-set">
    <div class="np-field-group">
      <div class="np-field" role="group">
        <label class="np-field-label" for="username"
          >Username <span style="color: var(--np-destructive)"> * </span></label
        >
        <input
          id="username"
          class="np-input"
          type="text"
          placeholder="Max Leiter"
        />
        <p class="np-field-description">
          Choose a unique username for your account.
        </p>
      </div>
      <div class="np-field" role="group">
        <label class="np-field-label" for="password"
          >Password <span style="color: var(--np-destructive)"> * </span></label
        >
        <p class="np-field-description">Must be at least 8 characters long.</p>
        <input
          id="password"
          class="np-input"
          type="password"
          placeholder="••••••••"
        />
      </div>
    </div>
  </fieldset>
</div>
