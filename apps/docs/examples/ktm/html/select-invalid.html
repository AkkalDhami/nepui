<div style="width: 12rem" class="np-field" data-invalid role="group">
  <label class="np-field-label" for="fruit">Fruit</label>
  <select
    id="fruit"
    class="np-select"
    aria-label="Fruit"
    data-invalid
    aria-describedby="select-invalid-message"
  >
    <option value="" selected disabled hidden>Select a fruit</option>
    <option value="apple">Apple</option>
    <option value="banana">Banana</option>
    <option value="blueberry">Blueberry</option>
  </select>
  <p class="np-field-error" style="margin: 0" role="alert">
    Please select a fruit.
  </p>
</div>
