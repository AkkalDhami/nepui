<link rel="stylesheet" href="./styles/field.css" />

<div style="display: grid; place-items: center">
  <div class="np-field">
    <label class="np-field-label" id="otp-demo-label" for="otp-demo"
      >Verification code</label
    >
    <div class="np-otp-field" role="group" aria-labelledby="otp-demo-label">
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="one-time-code"
        id="otp-demo"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 2 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 3 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 4 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 5 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        aria-label="Character 6 of 6"
      />
    </div>
    <p class="np-field-description">
      Enter the 6-digit code we sent to your device.
    </p>
  </div>
</div>
