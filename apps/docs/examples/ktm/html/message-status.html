<link rel="stylesheet" href="./styles/bubble.css" />
<link rel="stylesheet" href="./styles/avatar.css" />
<link rel="stylesheet" href="./styles/marker.css" />

<div style="width: 100%; max-width: 28rem">
  <div class="np-message">
    <div class="np-message-avatar">
      <span class="np-avatar">
        <img
          class="np-avatar-image"
          src="https://github.com/pratapchaulagain.png"
          alt="@pratapchaulagain"
          onerror="this.hidden = true"
        />
        <span class="np-avatar-fallback">PC</span>
      </span>
    </div>
    <div class="np-message-content">
      <div class="np-marker" role="status">
        <span class="np-marker-icon">
          <span class="np-spinner" aria-hidden="true"></span>
        </span>
        <span class="np-marker-content">Checking the logs...</span>
      </div>
    </div>
  </div>
</div>
