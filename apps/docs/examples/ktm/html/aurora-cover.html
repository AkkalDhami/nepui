<link rel="stylesheet" href="./styles/gradient-text.css" />
<link rel="stylesheet" href="./styles/button.css" />

<section
  class="np-aurora"
  data-gradient="sunset"
  data-mask="none"
  data-intensity="strong"
  style="
    display: grid;
    place-items: center;
    gap: 1rem;
    padding: 5rem 1.5rem;
    text-align: center;
    border-radius: var(--np-radius-xl);
    border: 1px solid var(--np-border);
  "
>
  <h1
    style="
      margin: 0;
      max-width: 32rem;
      font-size: 3.25rem;
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.035em;
    "
  >
    Ship something
    <span class="np-gradient-text" data-gradient="fire">beautiful</span>
  </h1>
  <p style="margin: 0; max-width: 26rem">
    The glow covers the whole section, so the content stays in front.
  </p>
  <button type="button" class="np-button">Start building</button>
</section>
