<div
  class="np-carousel"
  role="region"
  aria-roledescription="carousel"
  aria-label="Slides"
  style="width: calc(100% - 6rem); max-width: 20rem; margin-inline: auto"
>
  <div class="np-carousel-viewport">
    <div class="np-carousel-content">
      <div
        class="np-carousel-item"
        role="group"
        aria-roledescription="slide"
        aria-label="1 of 5"
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 1px solid var(--np-border);
            border-radius: var(--np-radius-xl);
            background: var(--np-background);
            font-weight: 600;
            aspect-ratio: 1;
            font-size: 2.25rem;
          "
        >
          1
        </div>
      </div>
      <div
        class="np-carousel-item"
        role="group"
        aria-roledescription="slide"
        aria-label="2 of 5"
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 1px solid var(--np-border);
            border-radius: var(--np-radius-xl);
            background: var(--np-background);
            font-weight: 600;
            aspect-ratio: 1;
            font-size: 2.25rem;
          "
        >
          2
        </div>
      </div>
      <div
        class="np-carousel-item"
        role="group"
        aria-roledescription="slide"
        aria-label="3 of 5"
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 1px solid var(--np-border);
            border-radius: var(--np-radius-xl);
            background: var(--np-background);
            font-weight: 600;
            aspect-ratio: 1;
            font-size: 2.25rem;
          "
        >
          3
        </div>
      </div>
      <div
        class="np-carousel-item"
        role="group"
        aria-roledescription="slide"
        aria-label="4 of 5"
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 1px solid var(--np-border);
            border-radius: var(--np-radius-xl);
            background: var(--np-background);
            font-weight: 600;
            aspect-ratio: 1;
            font-size: 2.25rem;
          "
        >
          4
        </div>
      </div>
      <div
        class="np-carousel-item"
        role="group"
        aria-roledescription="slide"
        aria-label="5 of 5"
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 1px solid var(--np-border);
            border-radius: var(--np-radius-xl);
            background: var(--np-background);
            font-weight: 600;
            aspect-ratio: 1;
            font-size: 2.25rem;
          "
        >
          5
        </div>
      </div>
    </div>
  </div>
  <div class="np-carousel-dots"></div>
  <button
    type="button"
    class="np-button np-button-outline np-button-icon-sm np-carousel-previous"
    aria-label="Previous slide"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m12 19-7-7 7-7" />
      <path d="M19 12H5" />
    </svg>
  </button>
  <button
    type="button"
    class="np-button np-button-outline np-button-icon-sm np-carousel-next"
    aria-label="Next slide"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M5 12h14" />
      <path d="m12 5 7 7-7 7" />
    </svg>
  </button>
</div>
