<link rel="stylesheet" href="./styles/field.css" />

<div style="display: grid; place-items: center">
  <div class="np-field" data-invalid>
    <label class="np-field-label" id="otp-invalid-label" for="otp-invalid"
      >Verification code</label
    >
    <div class="np-otp-field" role="group" aria-labelledby="otp-invalid-label">
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="6"
        aria-invalid
        autocomplete="one-time-code"
        id="otp-invalid"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="5"
        aria-invalid
        aria-label="Character 2 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="4"
        aria-invalid
        aria-label="Character 3 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="3"
        aria-invalid
        aria-label="Character 4 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="2"
        aria-invalid
        aria-label="Character 5 of 6"
      />
      <input
        class="np-otp-field-input"
        type="text"
        inputmode="numeric"
        maxlength="1"
        value="1"
        aria-invalid
        aria-label="Character 6 of 6"
      />
    </div>
    <p class="np-field-error">Please enter a valid code.</p>
  </div>
</div>
