<link rel="stylesheet" href="./styles/button.css" />

<div class="np-card np-card-sm" style="width: 100%; max-width: 24rem">
  <div class="np-card-header">
    <div class="np-card-title">Scheduled reports</div>
    <div class="np-card-description">
      Weekly snapshots. No more manual exports.
    </div>
  </div>
  <div class="np-card-content">
    <ul
      style="
        display: grid;
        gap: 0.5rem;
        margin: 0;
        padding-inline-start: 1.25rem;
      "
    >
      <li>Choose a schedule (daily, or weekly).</li>
      <li>Send to channels or specific teammates.</li>
      <li>Include charts, tables, and key metrics.</li>
    </ul>
  </div>
  <div class="np-card-footer" style="gap: 0.5rem; flex-direction: column">
    <button type="button" style="width: 100%" class="np-button np-button-sm">
      Set up scheduled reports
    </button>
    <button
      type="button"
      style="width: 100%"
      class="np-button np-button-sm np-button-outline"
    >
      See what's new
    </button>
  </div>
</div>
