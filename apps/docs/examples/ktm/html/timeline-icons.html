<div
  class="np-timeline"
  aria-label="Activity"
  style="width: 100%; max-width: 24rem"
>
  <div class="np-timeline-item">
    <span class="np-timeline-marker"
      ><svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
        /></svg
    ></span>
    <span class="np-timeline-connector"></span>
    <div class="np-timeline-title">Comment added</div>
    <time class="np-timeline-time">2 hours ago</time>
    <div class="np-timeline-description">Looks good to me.</div>
  </div>
  <div class="np-timeline-item">
    <span class="np-timeline-marker"
      ><svg

    ></span>
    <span class="np-timeline-connector"></span>

      ><svg

        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"

        <circle cx="12" cy="12" r="10" />
