<link rel="stylesheet" href="./styles/button.css" />

<div class="np-group" role="group" aria-label="Pagination">
  <div class="np-group" role="group" aria-label="Pages">
    <button type="button" class="np-button np-button-outline np-button-icon">
      1
    </button>
    <button
      type="button"
      class="np-button np-button-outline np-button-icon"
      aria-current="page"
    >
      2
    </button>
    <button type="button" class="np-button np-button-outline np-button-icon">
      3
    </button>
    <button type="button" class="np-button np-button-outline np-button-icon">
      4
    </button>
    <button type="button" class="np-button np-button-outline np-button-icon">
      5
    </button>
  </div>
  <div class="np-group" role="group" aria-label="Previous and next">
    <button type="button" class="np-button np-button-outline">Previous</button>
    <button type="button" class="np-button np-button-outline">Next</button>
  </div>
</div>
