<div
  class="np-resizable"
  style="
    width: 100%;
    max-width: 28rem;
    height: 12.5rem;
    border: 1px solid var(--np-border);
    border-radius: var(--np-radius-lg);
  "
>
  <div
    class="np-resizable-panel"
    data-min-size="15"
    data-max-size="40"
    data-default-size="25"
  >
    <div
      style="
        display: flex;
        box-sizing: border-box;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      "
    >
      <span style="font-weight: 600">15–40%</span>
    </div>
  </div>
  <div
    class="np-resizable-handle"
    role="separator"
    tabindex="0"
    aria-label="Resize sidebar"
  >
    <div class="np-resizable-grip"></div>
  </div>
  <div class="np-resizable-panel" data-min-size="60" data-default-size="75">
    <div
      style="
        display: flex;
        box-sizing: border-box;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      "
    >
      <span style="font-weight: 600">Content</span>
    </div>
  </div>
</div>
