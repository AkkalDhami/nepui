<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Separator - nepui</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/separator.css" />

    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: var(--np-background);
        color: var(--np-foreground);
      }
      .demo {
        max-width: 28rem;
      }
      h2 {
        margin: 2rem 0 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.6;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        opacity: 0.7;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 1rem;
        height: 1.5rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <section>
        <h2>Horizontal (class)</h2>
        <strong>nepui</strong>
        <p>A set of accessible UI components.</p>
        <div class="np-separator" role="separator" style="margin: 1rem 0"></div>
        <p>Plain CSS, no framework required.</p>
      </section>

      <section>
        <h2>Vertical (data attributes)</h2>
        <div class="row">
          <span>Blog</span>
          <div
            data-np-separator
            data-orientation="vertical"
            role="separator"
            aria-orientation="vertical"
          ></div>
          <span>Docs</span>
          <div
            data-np-separator
            data-orientation="vertical"
            role="separator"
            aria-orientation="vertical"
          ></div>
          <span>Source</span>
        </div>
      </section>

      <section>
        <h2>On an &lt;hr&gt;</h2>
        <p>Above</p>
        <hr class="np-separator" style="margin: 1rem 0" />
        <p>Below</p>
      </section>

      <section>
        <h2>Custom color and thickness</h2>
        <div
          class="np-separator"
          role="separator"
          style="--np-separator-color: #7c3aed; --np-separator-size: 2px"
        ></div>
      </section>
    </main>
  </body>
</html>
