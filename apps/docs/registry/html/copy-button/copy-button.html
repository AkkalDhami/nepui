<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Copy Button - nepui</title>

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="./styles/copy-button.css" />
  </head>

  <body>
    <div class="np-preview">
      <section class="np-preview-section">
        <h3>Default</h3>

        <div class="np-preview-row">
          <button
            class="np-button np-copy-button"
            data-variant="outline"
            type="button"
            data-copy="npx nepui@latest add copy-button"
          >
            Copy
          </button>
        </div>
      </section>

      <section class="np-preview-section">
        <h3>Copy from target</h3>

        <div class="np-preview-stack">
          <pre
            id="example-code"
          ><code>npx nepui@latest add copy-button test</code></pre>

          <div class="np-preview-row">
            <button
              class="np-button np-copy-button"
              data-variant="outline"
              type="button"
              data-copy-target="#example-code"
            >
              Copy code
            </button>
          </div>
        </div>
      </section>

      <section class="np-preview-section">
        <h3>Icon only</h3>

        <div class="np-preview-row">
          <button
            class="np-button np-copy-button"
            data-variant="outline"
            data-size="icon"
            type="button"
            data-copy="npx nepui@latest add copy-button"
            aria-label="Copy command"
          ></button>
          <button
            class="np-button np-copy-button"
            data-variant="ghost"
            data-size="icon"
            type="button"
            data-copy="npx nepui@latest add copy-button"
            aria-label="Copy command"
          ></button>

          <button
            class="np-button np-button-rounded np-copy-button"
            data-variant="outline"
            data-size="icon"
            type="button"
            data-copy="npx nepui@latest add copy-button"
            aria-label="Copy"
          ></button>
        </div>
      </section>
    </div>

    <script src="./javascripts/copy-button.js"></script>
  </body>
</html>
