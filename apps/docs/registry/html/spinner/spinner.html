<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinner - nepui</title>
    <link rel="stylesheet" href="../styles/spinner.css" />
  </head>
  <body>
    <div class="np-preview">
      <section class="np-preview-section">
        <h3>Sizes</h3>

        <div class="np-preview-row">
          <span class="np-spinner" data-size="xs"></span>

          <span class="np-spinner np-spinner-sm"></span>

          <span class="np-spinner" data-size="md"></span>

          <span class="np-spinner np-spinner-lg"></span>

          <span class="np-spinner" style="--np-spinner-size: 2.5rem"></span>
        </div>
      </section>

      <section class="np-preview-section">
        <h3>Speed</h3>

        <div class="np-preview-row">
          <span data-np-spinner data-speed="slow"></span>

          <span data-np-spinner class="np-spinner-normal"></span>

          <span data-np-spinner data-speed="fast"></span>

          <span data-np-spinner class="np-spinner-faster"></span>

          <span data-np-spinner style="--np-spinner-speed: 100ms"></span>
        </div>
      </section>

      <section class="np-preview-section">
        <h3>Thickness</h3>

        <div class="np-preview-row">
          <span
            class="np-spinner"
            data-thickness="thin"
            aria-label="Loading"
          ></span>

          <span
            class="np-spinner np-spinner-thickness-normal"
            aria-label="Loading"
          ></span>

          <span
            class="np-spinner"
            data-thickness="medium"
            aria-label="Loading"
          ></span>

          <span
            class="np-spinner"
            data-thickness="thick"
            aria-label="Loading"
          ></span>

          <span
            class="np-spinner np-spinner-thickness-extra-thick"
            aria-label="Loading"
          ></span>

          <span class="np-spinner" style="--np-spinner-thickness: 18px"></span>
        </div>
      </section>

      <section class="np-preview-section">
        <h3>Directions</h3>

        <div class="np-preview-row">
          <span data-np-spinner data-direction="clockwise"></span>

          <span data-np-spinner class="np-spinner-counterclockwise"></span>
        </div>
      </section>
    </div>
  </body>
</html>
