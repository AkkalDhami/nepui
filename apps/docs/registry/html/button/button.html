<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button - nepui</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/button.css" />
  </head>

  <body>
    <div class="np-preview">
      <section class="np-preview-section">
        <h3>Variants</h3>

        <div class="np-preview-row">
          <button class="np-button" data-variant="default">Default</button>

          <button class="np-button" data-variant="outline">Outline</button>

          <button class="np-button" data-variant="secondary">Secondary</button>

          <button class="np-button" data-variant="ghost">Ghost</button>

          <a
            class="np-button"
            href="https://github.com/akkaldhami/nepui"
            target="_blank"
            data-variant="link"
          >
            Docs
          </a>

          <button class="np-button" data-variant="destructive">
            Destructive
          </button>
        </div>
      </section>

      <section class="np-preview-section">
        <h3>Sizes</h3>

        <div class="np-preview-row">
          <button class="np-button" data-size="xs">Extra small</button>
          <button class="np-button" data-size="sm">Small</button>
          <button class="np-button" data-size="md">Default</button>
          <button class="np-button" data-size="lg">Large</button>
        </div>
      </section>

      <section class="np-preview-section">
        <h3>Icon sizes</h3>

        <div class="np-preview-row">
          <button class="np-button" type="button" data-size="icon-xs">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M8 3v10M3 8h10"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <button class="np-button" type="button" data-size="icon-sm">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M8 3v10M3 8h10"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <button class="np-button" type="button" data-size="icon">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M8 3v10M3 8h10"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <button class="np-button" type="button" data-size="icon-lg">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M8 3v10M3 8h10"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </section>

      <section class="np-preview-section">
        <h3>States</h3>

        <div class="np-preview-row">
          <button class="np-button" disabled>Disabled</button>

          <button class="np-button" data-loading>Loading...</button>
        </div>
      </section>
    </div>
  </body>
</html>
