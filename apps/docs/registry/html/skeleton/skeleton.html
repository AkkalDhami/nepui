<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skeleton - nepui</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/skeleton.css" />

    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: var(--np-background);
        color: var(--np-foreground);
      }
      .demo {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        max-width: 24rem;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <section>
        <h2>Avatar and text (class)</h2>
        <div class="row" aria-busy="true">
          <div
            class="np-skeleton np-skeleton-circle"
            style="width: 3rem; height: 3rem; flex-shrink: 0"
          ></div>
          <div class="stack" style="flex: 1">
            <div
              class="np-skeleton"
              style="width: 15rem; max-width: 100%"
            ></div>
            <div
              class="np-skeleton"
              style="width: 12rem; max-width: 100%"
            ></div>
          </div>
        </div>
      </section>

      <section>
        <h2>Card (data attributes)</h2>
        <div class="stack" aria-busy="true">
          <div data-np-skeleton style="height: 8rem; width: 100%"></div>
          <div data-np-skeleton style="width: 70%"></div>
          <div data-np-skeleton style="width: 45%"></div>
        </div>
      </section>

      <section>
        <h2>Shape and color</h2>
        <div class="row">
          <div
            data-np-skeleton
            data-shape="circle"
            style="width: 2.5rem; height: 2.5rem"
          ></div>
          <div
            class="np-skeleton"
            style="width: 8rem; height: 2rem; --np-skeleton-color: #7c3aed33"
          ></div>
        </div>
      </section>
    </main>
  </body>
</html>
