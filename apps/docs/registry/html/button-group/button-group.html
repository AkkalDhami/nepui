<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Group - nepui</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="./button-group.css" />

    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: var(--np-background);
        color: var(--np-foreground);
      }
      .demo {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        max-width: 32rem;
      }
      h2 {
        margin: 0 0 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <section>
        <h2>Outline buttons (class)</h2>
        <div class="np-button-group" role="group">
          <button class="np-button np-button-outline">Archive</button>
          <button class="np-button np-button-outline">Report</button>
          <button class="np-button np-button-outline">Snooze</button>
        </div>
      </section>

      <section>
        <h2>Separator between solid buttons (data attributes)</h2>
        <div data-np-button-group role="group">
          <button data-np-button data-variant="secondary">Copy</button>
          <div
            data-np-button-group-separator
            role="separator"
            aria-orientation="vertical"
          ></div>
          <button data-np-button data-variant="secondary">Paste</button>
        </div>
      </section>

      <section>
        <h2>Vertical</h2>
        <div class="np-button-group np-button-group-vertical" role="group">
          <button class="np-button np-button-outline">Top</button>
          <button class="np-button np-button-outline">Middle</button>
          <button class="np-button np-button-outline">Bottom</button>
        </div>
      </section>

      <section>
        <h2>Text and input</h2>
        <div class="np-button-group" role="group" style="width: 100%">
          <span class="np-button-group-text">https://</span>
          <input class="np-input" placeholder="example.com" />
          <button class="np-button np-button-outline">Go</button>
        </div>
      </section>

      <section>
        <h2>Icon buttons and sizes</h2>
        <div class="np-button-group" role="group">
          <button class="np-button np-button-outline np-button-sm">Day</button>
          <button class="np-button np-button-outline np-button-sm">Week</button>
          <button class="np-button np-button-outline np-button-sm">
            Month
          </button>
        </div>
      </section>

      <section>
        <h2>Nested groups</h2>
        <div class="np-button-group" role="group">
          <div class="np-button-group" role="group">
            <button class="np-button np-button-outline">1</button>
            <button class="np-button np-button-outline">2</button>
          </div>
          <div class="np-button-group" role="group">
            <button class="np-button np-button-outline">Prev</button>
            <button class="np-button np-button-outline">Next</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
