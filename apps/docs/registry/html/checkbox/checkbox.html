<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkbox - nepui</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="./checkbox.css" />

    <!-- Inline page styles (demo layout only) -->
    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: var(--np-background);
        color: var(--np-foreground);
      }
      .demo {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 22rem;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <!-- Native inputs: class or data attribute -->
      <div class="row">
        <input id="c1" type="checkbox" class="np-checkbox" />
        <label class="np-label" for="c1">Class</label>
      </div>

      <div class="row">
        <input id="c2" type="checkbox" data-np-checkbox checked />
        <label class="np-label" for="c2">Data attribute (checked)</label>
      </div>

      <div class="row">
        <input id="c3" type="checkbox" class="np-checkbox" />
        <label class="np-label" for="c3">Indeterminate (set via JS)</label>
      </div>

      <div class="row">
        <input
          id="c4"
          type="checkbox"
          class="np-checkbox"
          aria-invalid="true"
        />
        <label class="np-label" for="c4">Invalid</label>
      </div>

      <div class="row">
        <input id="c5" type="checkbox" class="np-checkbox" disabled />
        <label class="np-label" for="c5">Disabled</label>
      </div>

      <div class="row">
        <input id="c6" type="checkbox" class="np-checkbox" disabled checked />
        <label class="np-label" for="c6">Disabled checked</label>
      </div>

      <!-- Same markup the React component renders -->
      <div class="row">
        <span
          class="np-checkbox"
          role="checkbox"
          aria-checked="true"
          tabindex="0"
          data-checked
        >
          <span class="np-checkbox-indicator">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </span>
        </span>
        <span class="np-label">Span + indicator (React markup)</span>
      </div>
    </main>

    <script>
      document.getElementById("c3").indeterminate = true
    </script>
  </body>
</html>
