<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu - nepui</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="./menu.css" />

    <script src="./menu.js" defer></script>

    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: var(--np-background);
        color: var(--np-foreground);
      }
      .demo {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        max-width: 32rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <div>
        <button
          class="np-button np-button-outline np-button-sm"
          type="button"
          onclick="document.documentElement.classList.toggle('dark')"
        >
          Toggle dark
        </button>
      </div>

      <section>
        <h2>Basic (class)</h2>
        <div class="np-menu" style="--np-menu-anchor: --menu-basic">
          <button
            class="np-button np-button-outline"
            type="button"
            popovertarget="menu-basic"
          >
            Open
          </button>
          <div
            id="menu-basic"
            class="np-menu-content"
            popover
            role="menu"
            aria-label="My Account"
            style="width: 12rem"
          >
            <div
              class="np-menu-group"
              role="group"
              aria-labelledby="menu-basic-label"
            >
              <div class="np-menu-label" id="menu-basic-label">My Account</div>
              <button
                class="np-menu-item"
                type="button"
                role="menuitem"
                popovertarget="menu-basic"
                popovertargetaction="hide"
              >
                Profile <span class="np-menu-shortcut">⇧⌘P</span>
              </button>
              <button
                class="np-menu-item"
                type="button"
                role="menuitem"
                popovertarget="menu-basic"
                popovertargetaction="hide"
              >
                Billing <span class="np-menu-shortcut">⌘B</span>
              </button>
              <button
                class="np-menu-item"
                type="button"
                role="menuitem"
                disabled
              >
                Settings
              </button>
            </div>
            <div class="np-menu-separator" role="separator"></div>
            <button
              class="np-menu-item np-menu-item-destructive"
              type="button"
              role="menuitem"
              popovertarget="menu-basic"
              popovertargetaction="hide"
            >
              Delete account
            </button>
          </div>
        </div>
      </section>

      <section>
        <h2>Data attributes</h2>
        <div data-np-menu style="--np-menu-anchor: --menu-data">
          <button
            data-np-button
            data-variant="outline"
            type="button"
            popovertarget="menu-data"
          >
            Open
          </button>
          <div
            id="menu-data"
            data-np-menu-content
            popover
            role="menu"
            aria-label="Actions"
            style="width: 12rem"
          >
            <button data-np-menu-item type="button" role="menuitem">
              Edit
            </button>
            <button data-np-menu-item type="button" role="menuitem">
              Duplicate
            </button>
            <div data-np-menu-separator role="separator"></div>
            <button
              data-np-menu-item
              data-variant="destructive"
              type="button"
              role="menuitem"
            >
              Delete
            </button>
          </div>
        </div>
      </section>

      <section>
        <h2>Submenu, checkboxes and radio items</h2>
        <div class="row">
          <div class="np-menu" style="--np-menu-anchor: --menu-sub">
            <button
              class="np-button np-button-outline"
              type="button"
              popovertarget="menu-sub"
            >
              Submenu
            </button>
            <div
              id="menu-sub"
              class="np-menu-content"
              popover
              role="menu"
              aria-label="Team"
              style="width: 12rem"
            >
              <button class="np-menu-item" type="button" role="menuitem">
                Team
              </button>
              <div
                class="np-menu-sub"
                style="--np-menu-anchor: --menu-sub-invite"
              >
                <button
                  class="np-menu-item np-menu-sub-trigger"
                  type="button"
                  role="menuitem"
                  aria-haspopup="menu"
                  popovertarget="menu-sub-invite"
                >
                  Invite users
                  <svg
                    class="np-menu-sub-chevron"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="m9 18 6-6-6-6" />
                  </svg>
                </button>
                <div
                  id="menu-sub-invite"
                  class="np-menu-content np-menu-sub-content"
                  popover
                  role="menu"
                  aria-label="Invite users"
                >
                  <button class="np-menu-item" type="button" role="menuitem">
                    Email
                  </button>
                  <button class="np-menu-item" type="button" role="menuitem">
                    Message
                  </button>
                </div>
              </div>
              <button class="np-menu-item" type="button" role="menuitem">
                New Team
              </button>
            </div>
          </div>

          <div class="np-menu" style="--np-menu-anchor: --menu-check">
            <button
              class="np-button np-button-outline"
              type="button"
              popovertarget="menu-check"
            >
              Checkboxes
            </button>
            <div
              id="menu-check"
              class="np-menu-content"
              popover
              role="menu"
              aria-label="Appearance"
              style="width: 14rem"
            >
              <button
                class="np-menu-item np-menu-checkbox-item"
                type="button"
                role="menuitemcheckbox"
                aria-checked="true"
                onclick="
                  this.setAttribute(
                    'aria-checked',
                    this.getAttribute('aria-checked') !== 'true'
                  )
                "
              >
                <span class="np-menu-item-indicator"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M20 6 9 17l-5-5" /></svg
                ></span>
                Status Bar
              </button>
              <button
                class="np-menu-item np-menu-checkbox-item"
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                onclick="
                  this.setAttribute(
                    'aria-checked',
                    this.getAttribute('aria-checked') !== 'true'
                  )
                "
              >
                <span class="np-menu-item-indicator"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M20 6 9 17l-5-5" /></svg
                ></span>
                Panel
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      /* Optional: arrow-key navigation and focus on open. */
      document.addEventListener(
        "toggle",
        (event) => {
          if (
            event.newState === "open" &&
            event.target.matches('[role="menu"]')
          ) {
            event.target
              .querySelector('[role^="menuitem"]:not(:disabled)')
              ?.focus()
          }
        },
        true
      )

      document.addEventListener("keydown", (event) => {
        const menu = event.target.closest('[role="menu"]')
        if (!menu) return

        const items = [
          ...menu.querySelectorAll('[role^="menuitem"]:not(:disabled)'),
        ].filter((item) => item.closest('[role="menu"]') === menu)
        const index = items.indexOf(document.activeElement)
        let next

        if (event.key === "ArrowDown") next = items[(index + 1) % items.length]
        else if (event.key === "ArrowUp")
          next = items[(index - 1 + items.length) % items.length]
        else if (event.key === "Home") next = items[0]
        else if (event.key === "End") next = items[items.length - 1]

        if (next) {
          event.preventDefault()
          next.focus()
        }
      })
    </script>
  </body>
</html>
