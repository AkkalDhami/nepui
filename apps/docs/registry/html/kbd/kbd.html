<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kbd - nepui</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/button.css" />
    <link rel="stylesheet" href="../styles/input.css" />
    <link rel="stylesheet" href="../styles/button-group.css" />
    <link rel="stylesheet" href="../styles/kbd.css" />

    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: var(--np-background);
        color: var(--np-foreground);
      }
      .demo {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        max-width: 28rem;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.6;
      }
      .muted {
        margin: 0;
        font-size: 0.875rem;
        color: var(--np-muted-foreground);
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <section>
        <h2>Keys (class and data attribute)</h2>
        <p class="muted">
          Press <kbd class="np-kbd">Esc</kbd> or <kbd data-np-kbd>Enter</kbd> to
          continue.
        </p>
      </section>

      <section>
        <h2>Group</h2>
        <kbd class="np-kbd-group">
          <kbd class="np-kbd">⌘</kbd>
          <kbd class="np-kbd">⇧</kbd>
          <kbd class="np-kbd">K</kbd>
        </kbd>
      </section>

      <section>
        <h2>In a button</h2>
        <button
          class="np-button np-button-outline np-button-sm"
          type="button"
          style="padding-right: 0.375rem"
        >
          Accept <kbd class="np-kbd">⏎</kbd>
        </button>
      </section>

      <section>
        <h2>In a button group with an input</h2>
        <div class="np-button-group" role="group" style="width: 100%">
          <input
            class="np-input"
            type="search"
            placeholder="Search..."
            aria-label="Search"
          />
          <span class="np-button-group-text">
            <kbd class="np-kbd-group"
              ><kbd class="np-kbd">⌘</kbd><kbd class="np-kbd">K</kbd></kbd
            >
          </span>
        </div>
      </section>
    </main>
  </body>
</html>
