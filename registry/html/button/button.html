<section class="np-button-preview">
  <div class="np-button-preview-group">
    <h3>Variants</h3>

    <div class="np-button-preview-row">
      <button class="np-button" type="button" data-variant="default">
        Default
      </button>

      <button class="np-button" type="button" data-variant="outline">
        Outline
      </button>

      <button
        class="np-button np-button-secondary"
        type="button"
        data-variant="secondary"
      >
        Secondary
      </button>

      <button
        class="np-button np-button-ghost"
        type="button"
        data-variant="ghost"
      >
        Ghost
      </button>

      <button
        class="np-button np-button-destructive"
        type="button"
        data-variant="destructive"
      >
        Destructive
      </button>
    </div>
  </div>

  <div class="np-button-preview-group">
    <h3>Sizes</h3>

    <div class="np-button-preview-row">
      <button class="np-button np-button-xs" type="button" data-size="xs">
        Extra small
      </button>

      <button class="np-button np-button-sm" type="button" data-size="sm">
        Small
      </button>

      <button class="np-button" type="button" data-size="default">
        Default
      </button>

      <button class="np-button np-button-lg" type="button" data-size="lg">
        Large
      </button>
    </div>
  </div>

  <div class="np-button-preview-group">
    <h3>Icon sizes</h3>

    <div class="np-button-preview-row">
      <button
        class="np-button np-button-icon-xs"
        type="button"
        data-size="icon-xs"
        aria-label="Settings"
      >
        ⚙
      </button>

      <button
        class="np-button np-button-icon-sm"
        type="button"
        data-size="icon-sm"
        aria-label="Settings"
      >
        ⚙
      </button>

      <button
        class="np-button np-button-icon"
        type="button"
        data-size="icon"
        aria-label="Settings"
      >
        ⚙
      </button>

      <button
        class="np-button np-button-icon-lg"
        type="button"
        data-size="icon-lg"
        aria-label="Settings"
      >
        ⚙
      </button>
    </div>
  </div>

  <div class="np-button-preview-group">
    <h3>States</h3>

    <div class="np-button-preview-row">
      <button
        class="np-button"
        type="button"
        data-variant="default"
        data-state="disabled"
        disabled
      >
        Disabled
      </button>

      <button
        class="np-button"
        type="button"
        data-variant="default"
        data-state="loading"
        aria-busy="true"
        disabled
      >
        Loading...
      </button>
    </div>
  </div>
</section>
